name: Build Kumaoni Potli Restaurant Panel APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Restaurant Panel APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-restaurant",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/assets --save-dev

      - name: Check Restaurant Icon
        run: |
          if [ ! -f "restaurant-icon.png" ]; then
            echo "ERROR: restaurant-icon.png not found"
            echo "Available PNG files:"
            find . -maxdepth 1 -type f -iname "*.png" -print
            exit 1
          fi

          echo "Restaurant icon found:"
          ls -lh restaurant-icon.png

      - name: Prepare Restaurant HTML
        run: |
          rm -rf www
          mkdir -p www

          FILE=$(find . -maxdepth 1 -type f -iname "*restaurant*.html" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Restaurant HTML file not found"
            echo "Available HTML files:"
            find . -maxdepth 1 -type f -iname "*.html" -print
            exit 1
          fi

          echo "Using Restaurant HTML:"
          echo "$FILE"

          cp "$FILE" www/index.html

          echo "Restaurant web file:"
          ls -lh www/index.html

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.annapurna.restaurant",
            "appName": "Kumaoni Potli Restaurant Panel",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Copy Firebase configuration
        run: |
          if [ -f "google-services Restaurant.json" ]; then
            mkdir -p android/app
            cp "google-services Restaurant.json" android/app/google-services.json
          elif [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp "google-services.json" android/app/google-services.json
          else
            echo "ERROR: Firebase google-services file not found"
            exit 1
          fi

      - name: Verify Restaurant Firebase package
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: google-services.json missing"
            exit 1
          fi

          if grep -q '"package_name": "com.annapurna.restaurant"' android/app/google-services.json; then
            echo "Restaurant Firebase package verified successfully."
          else
            echo "ERROR: com.annapurna.restaurant is not registered in google-services.json"
            exit 1
          fi

      - name: Set Restaurant App Icon
        run: |
          rm -rf resources
          mkdir -p resources

          cp restaurant-icon.png resources/icon.png

          echo "Restaurant icon copied:"
          ls -lh resources/icon.png

          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
              }
          }
          EOF

      - name: Build Restaurant APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename Restaurant APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
          android/app/build/outputs/apk/debug/Kumaoni-Potli-Restaurant-Panel.apk

          echo "Final APK:"
          ls -lh android/app/build/outputs/apk/debug/Kumaoni-Potli-Restaurant-Panel.apk

      - name: Upload Restaurant APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Restaurant-Panel
          path: android/app/build/outputs/apk/debug/Kumaoni-Potli-Restaurant-Panel.apk
          if-no-files-found: error
