name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ============================================================
      # CREATE PACKAGE.JSON
      # ============================================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-admin",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF


      # ============================================================
      # INSTALL CAPACITOR
      # ============================================================
      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/assets --save-dev


      # ============================================================
      # PREPARE CURRENT ADMIN HTML
      # ============================================================
      - name: Prepare Admin HTML
        run: |
          set -e

          rm -rf www
          mkdir -p www

          FILE="./Kumaoni-Potli-Admin-FIXED.html"

          echo "============================================"
          echo "CHECKING CURRENT ADMIN HTML"
          echo "============================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Admin HTML file not found:"
            echo "$FILE"
            echo ""
            echo "Available HTML files:"
            find . -maxdepth 2 -type f -iname "*.html" -print
            exit 1
          fi

          echo "Using Admin file:"
          echo "$FILE"

          cp "$FILE" www/index.html

          echo ""
          echo "Admin index.html:"
          ls -lh www/index.html


      # ============================================================
      # VERIFY ADMIN PANEL
      # ============================================================
      - name: Verify Admin Panel
        run: |
          set -e

          FILE="./Kumaoni-Potli-Admin-FIXED.html"

          echo "============================================"
          echo "VERIFYING ADMIN PANEL"
          echo "============================================"

          if ! grep -qi "Kumaoni Potli" "$FILE"; then
            echo "ERROR: Kumaoni Potli branding not found."
            exit 1
          fi

          if ! grep -qi "Select Admin Page" "$FILE"; then
            echo "ERROR: Select Admin Page not found."
            exit 1
          fi

          if ! grep -qi "Menu Management" "$FILE"; then
            echo "ERROR: Menu Management not found."
            exit 1
          fi

          echo "Admin Panel verification successful."


      # ============================================================
      # CREATE CAPACITOR CONFIGURATION
      # ============================================================
      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.annapurna.admin",
            "appName": "Kumaoni Potli Admin",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF


      # ============================================================
      # ADD ANDROID PLATFORM
      # ============================================================
      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android


      # ============================================================
      # ADMIN APP ICON
      # ============================================================
      - name: Set Admin Panel App Icon
        run: |
          set -e

          if [ ! -f "admin-icon.png" ]; then
            echo "ERROR: admin-icon.png not found."
            exit 1
          fi

          rm -rf resources
          mkdir -p resources

          cp admin-icon.png resources/icon.png

          npx capacitor-assets generate --android

          echo "Admin icon generated successfully."


      # ============================================================
      # COPY FIREBASE CONFIGURATION
      # ============================================================
      - name: Copy Firebase configuration
        run: |
          set -e

          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json not found."
            exit 1
          fi

          mkdir -p android/app

          cp google-services.json \
             android/app/google-services.json

          echo "google-services.json copied successfully."


      # ============================================================
      # VERIFY FIREBASE PACKAGE
      # ============================================================
      - name: Verify Admin Firebase package
        run: |
          set -e

          echo "Firebase Android packages:"

          grep -n "package_name" \
            google-services.json || true

          if grep -q \
            '"package_name"[[:space:]]*:[[:space:]]*"com.annapurna.admin"' \
            google-services.json; then

            echo "Admin Firebase package verified successfully."

          else

            echo "ERROR: com.annapurna.admin is missing from google-services.json"
            exit 1

          fi


      # ============================================================
      # FIX KOTLIN DUPLICATE CLASSES
      # ============================================================
      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
              }
          }
          EOF


      # ============================================================
      # SYNC CAPACITOR
      # ============================================================
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ============================================================
      # VERIFY ADMIN ANDROID PROJECT
      # ============================================================
      - name: Verify Admin Android project
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version


      # ============================================================
      # GENERATE FIREBASE SHA FINGERPRINTS
      # ============================================================
      - name: Generate Firebase SHA Fingerprints
        working-directory: android
        run: |
          set -e

          echo "============================================"
          echo "KUMAONI POTLI ADMIN"
          echo "FIREBASE SHA FINGERPRINTS"
          echo "============================================"

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            echo "Creating debug keystore..."

            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "Debug keystore already exists."

          fi

          chmod +x gradlew

          echo ""
          echo "Generating signing report..."
          echo ""

          ./gradlew signingReport

          echo ""
          echo "============================================"
          echo "SHA FINGERPRINTS ABOVE"
          echo "Firebase Android App:"
          echo "com.annapurna.admin"
          echo "============================================"


      # ============================================================
      # BUILD ADMIN APK
      # ============================================================
      - name: Build Kumaoni Potli Admin APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace


      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify Admin APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Admin APK was not created."
            exit 1
          fi

          echo "============================================"
          echo "ADMIN APK CREATED SUCCESSFULLY"
          echo "============================================"

          ls -lh "$APK"


      # ============================================================
      # RENAME APK
      # ============================================================
      - name: Rename Admin APK
        run: |
          set -e

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/Kumaoni-Potli-Admin.apk

          echo "Final APK:"

          ls -lh \
            android/app/build/outputs/apk/debug/Kumaoni-Potli-Admin.apk


      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload Kumaoni Potli Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: android/app/build/outputs/apk/debug/Kumaoni-Potli-Admin.apk
          if-no-files-found: error
