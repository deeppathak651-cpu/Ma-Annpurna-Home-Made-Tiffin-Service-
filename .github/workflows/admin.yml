name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kumaoni Potli Admin Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ============================================================
      # 3. JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "ANDROID SDK SETUP"
          echo "========================================"

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT is not available."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "Latest sdkmanager not found."
            echo "Searching for sdkmanager..."

            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdkmanager=$SDKMANAGER"

          chmod +x "$SDKMANAGER" || true

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --list >/dev/null

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."

      # ============================================================
      # 5. SHOW FILES
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "REPOSITORY FILES"
          echo "========================================"

          echo ""
          echo "Root files:"
          ls -lah

          echo ""
          echo "Admin HTML files:"
          find . -maxdepth 2 -type f \
            -iname "*admin*.html" \
            -print

          echo ""
          echo "Images:"
          find . -maxdepth 2 -type f \
            \( -iname "*.png" \
            -o -iname "*.jpg" \
            -o -iname "*.jpeg" \
            -o -iname "*.webp" \
            -o -iname "*.svg" \
            -o -iname "*.ico" \) \
            -print

      # ============================================================
      # 6. SELECT ADMIN HTML
      # ============================================================
      - name: Select Admin HTML
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SELECTING KUMAONI POTLI ADMIN HTML"
          echo "========================================"

          ADMIN_HTML="Kumaoni-Potli-Admin-CONNECTED.html"

          if [ ! -f "$ADMIN_HTML" ]; then
            echo ""
            echo "ERROR:"
            echo "$ADMIN_HTML"
            echo "was not found."
            echo ""

            echo "Available HTML files:"
            find . -maxdepth 2 -type f \
              -iname "*.html" \
              -print

            exit 1
          fi

          echo "Using:"
          echo "$ADMIN_HTML"

          cp "$ADMIN_HTML" index.html

          test -s index.html

          echo ""
          echo "Admin HTML selected successfully."

      # ============================================================
      # 7. PREPARE WEB DIRECTORY
      # ============================================================
      - name: Prepare Admin web files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING ADMIN WEB FILES"
          echo "========================================"

          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          # --------------------------------------------------------
          # Copy root-level assets
          # --------------------------------------------------------

          find . -maxdepth 1 -type f \
            \( -iname "*.png" \
            -o -iname "*.jpg" \
            -o -iname "*.jpeg" \
            -o -iname "*.webp" \
            -o -iname "*.svg" \
            -o -iname "*.ico" \
            -o -iname "*.css" \
            -o -iname "*.js" \
            -o -iname "*.json" \) \
            -exec cp {} www/ \;

          # --------------------------------------------------------
          # Copy common asset folders if they exist
          # --------------------------------------------------------

          for DIR in assets images img css js fonts icons; do
            if [ -d "$DIR" ]; then
              cp -R "$DIR" "www/"
            fi
          done

          echo ""
          echo "Prepared web files:"
          find www -maxdepth 3 -type f -print

          test -s www/index.html

      # ============================================================
      # 8. VERIFY ADMIN LOGO
      # ============================================================
      - name: Verify Admin Logo
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ADMIN LOGO"
          echo "========================================"

          if [ -f "admin-icon.png" ]; then
            cp admin-icon.png www/admin-icon.png
            echo "Admin logo found: admin-icon.png"
          else
            echo "WARNING: admin-icon.png not found."
            echo "The APK will still build, but default icon may be used."
          fi

          if [ -f "www/admin-icon.png" ]; then
            ls -lh www/admin-icon.png
          fi

      # ============================================================
      # 9. CREATE PACKAGE.JSON
      # ============================================================
      - name: Create Capacitor package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CREATING CAPACITOR PACKAGE"
          echo "========================================"

          rm -f package.json package-lock.json

          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-admin",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Kumaoni Potli Admin"
            },
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF

          npm install

          echo "Capacitor packages installed."

      # ============================================================
      # 10. INITIALIZE CAPACITOR
      # ============================================================
      - name: Initialize Capacitor
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INITIALIZING CAPACITOR"
          echo "========================================"

          rm -rf android

          npx cap init \
            "Kumaoni Potli" \
            "com.kumaonipotli.admin" \
            --web-dir=www

      # ============================================================
      # 11. ADD ANDROID
      # ============================================================
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ADDING ANDROID PLATFORM"
          echo "========================================"

          npx cap add android

      # ============================================================
      # 12. CONFIGURE ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID SDK"
          echo "========================================"

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          EOF

          echo "sdk.dir configured."

      # ============================================================
      # 13. FIX KOTLIN DUPLICATE DEPENDENCIES
      # ============================================================
      - name: Fix Kotlin duplicate dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FIXING KOTLIN DUPLICATE DEPENDENCIES"
          echo "========================================"

          APP_GRADLE="android/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: $APP_GRADLE not found."
            exit 1
          fi

          cat >> "$APP_GRADLE" <<'EOF'

          // =========================================================
          // KUMAONI POTLI - KOTLIN DEPENDENCY FIX
          // =========================================================

          configurations.all {
              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21"

                  eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "2.0.21"
                      }
                  }
              }
          }

          EOF

          echo "Kotlin dependency resolution added."

      # ============================================================
      # 14. CONFIGURE GRADLE
      # ============================================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING GRADLE"
          echo "========================================"

          GRADLE_PROPERTIES="android/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          cat >> "$GRADLE_PROPERTIES" <<'EOF'

          # Kumaoni Potli build settings
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official

          EOF

          echo "Gradle configured."

      # ============================================================
      # 15. COPY WEB FILES TO ANDROID
      # ============================================================
      - name: Sync Admin web files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SYNCING ADMIN WEB FILES"
          echo "========================================"

          npx cap sync android

          test -f \
            android/app/src/main/assets/public/index.html

          echo "Admin HTML successfully copied into Android."

      # ============================================================
      # 16. SET APP NAME
      # ============================================================
      - name: Set Kumaoni Potli App Name
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SETTING APP NAME"
          echo "========================================"

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS_FILE" ]; then

            python3 - "$STRINGS_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          data = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">Kumaoni Potli</string>',
              data,
              flags=re.DOTALL
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)
          PY

          else
            echo "Creating strings.xml"

            mkdir -p android/app/src/main/res/values

            cat > "$STRINGS_FILE" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Kumaoni Potli</string>
          </resources>
          EOF

          fi

          echo "App name:"
          grep -n "app_name" "$STRINGS_FILE" || true

      # ============================================================
      # 17. INSTALL ADMIN APP ICON
      # ============================================================
      - name: Install Admin App Logo
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING KUMAONI POTLI ADMIN LOGO"
          echo "========================================"

          ICON_SOURCE="www/admin-icon.png"

          if [ ! -f "$ICON_SOURCE" ]; then
            echo "WARNING: Admin icon not found."
            echo "Skipping custom launcher icon."
            exit 0
          fi

          mkdir -p android/app/src/main/res/drawable

          cp "$ICON_SOURCE" \
            android/app/src/main/res/drawable/kumaoni_potli_admin_icon.png

          echo "Admin icon copied."

      # ============================================================
      # 18. SET ANDROID LAUNCHER ICON
      # ============================================================
      - name: Set Android Launcher Icon
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SETTING ANDROID LAUNCHER ICON"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          pattern = r'(<application\b[^>]*)(>)'

          if 'android:icon=' in data:
              data = re.sub(
                  r'android:icon="[^"]*"',
                  'android:icon="@drawable/kumaoni_potli_admin_icon"',
                  data
              )
          else:
              data = re.sub(
                  pattern,
                  r'\1\n        android:icon="@drawable/kumaoni_potli_admin_icon"\2',
                  data,
                  count=1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)
          PY

          grep -n "android:icon" "$MANIFEST" || true

      # ============================================================
      # 19. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/assets/public/index.html

          echo "Android project verification successful."

      # ============================================================
      # 20. SHOW CAPACITOR VERSION
      # ============================================================
      - name: Show Capacitor version
        shell: bash
        run: |
          set -e

          npx cap --version

      # ============================================================
      # 21. CLEAN GRADLE
      # ============================================================
      - name: Clean Android build
        shell: bash
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 22. BUILD ADMIN APK
      # ============================================================
      - name: Build Kumaoni Potli Admin APK
        shell: bash
        working-directory: android
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KUMAONI POTLI ADMIN APK"
          echo "========================================"

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 23. VERIFY APK
      # ============================================================
      - name: Verify Admin APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ADMIN APK"
          echo "========================================"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK generated:"
          ls -lh "$APK"

      # ============================================================
      # 24. RENAME APK
      # ============================================================
      - name: Prepare Kumaoni Potli APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING KUMAONI POTLI APK"
          echo "========================================"

          mkdir -p release

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" \
            "release/Kumaoni-Potli-Admin.apk"

          test -s \
            "release/Kumaoni-Potli-Admin.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh release/Kumaoni-Potli-Admin.apk

      # ============================================================
      # 25. UPLOAD APK
      # ============================================================
      - name: Upload Kumaoni Potli Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin
          path: release/Kumaoni-Potli-Admin.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 26. BUILD COMPLETE
      # ============================================================
      - name: Build Complete
        shell: bash
        run: |
          echo "========================================"
          echo "KUMAONI POTLI ADMIN BUILD COMPLETE"
          echo "========================================"
          echo ""
          echo "App Name: Kumaoni Potli"
          echo "Package: com.kumaonipotli.admin"
          echo "APK: Kumaoni-Potli-Admin.apk"
          echo ""
          echo "APK is ready in GitHub Actions Artifacts."
