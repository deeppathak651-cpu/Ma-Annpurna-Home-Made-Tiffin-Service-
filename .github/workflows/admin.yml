name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Verify Admin HTML
      - name: Verify Admin HTML
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING KUMAONI POTLI ADMIN PANEL"
          echo "========================================"

          ADMIN_FILE="Kumaoni-Potli-Admin-CONNECTED.html"

          if [ ! -f "$ADMIN_FILE" ]; then
            echo "ERROR: $ADMIN_FILE was not found."
            echo ""
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found: $ADMIN_FILE"
          echo "Admin HTML size:"
          wc -c "$ADMIN_FILE"

      # 5. Create Capacitor project
      - name: Create Capacitor project
        shell: bash
        run: |
          set -e

          rm -rf apk-build
          mkdir -p apk-build/www

          cp "Kumaoni-Potli-Admin-CONNECTED.html" \
             "apk-build/www/index.html"

          cd apk-build

          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/android

          npm install -D \
            @capacitor/cli

          npx cap init \
            "Kumaoni Potli Admin" \
            "com.kumaonipotli.admin" \
            --web-dir www

      # 6. Add Android
      - name: Create Android project
        shell: bash
        run: |
          set -e

          cd apk-build

          npx cap add android

      # 7. Configure Android
      - name: Configure Android
        shell: bash
        run: |
          set -e

          cd apk-build

          echo "Configuring Android application..."

          # Make sure app name is correct
          if [ -f "android/app/src/main/res/values/strings.xml" ]; then
            sed -i \
              's#<string name="app_name">.*</string>#<string name="app_name">Kumaoni Potli Admin</string>#' \
              android/app/src/main/res/values/strings.xml || true
          fi

      # 8. Copy web files
      - name: Sync web files
        shell: bash
        run: |
          set -e

          cd apk-build

          npx cap copy android

      # 9. Sync Capacitor
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          cd apk-build

          npx cap sync android

      # 10. Build Debug APK
      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          cd apk-build/android

          chmod +x gradlew

          ./gradlew assembleDebug

      # 11. Rename APK
      - name: Rename Admin APK
        shell: bash
        run: |
          set -e

          APK_PATH="apk-build/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" \
             "Kumaoni-Potli-Admin.apk"

          echo "APK created successfully:"
          ls -lh Kumaoni-Potli-Admin.apk

      # 12. Upload APK
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: Kumaoni-Potli-Admin.apk
          if-no-files-found: error
