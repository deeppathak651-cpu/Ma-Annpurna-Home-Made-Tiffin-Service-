name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/main.yml'
      - 'Kumaoni-Potli-Admin-CONNECTED.html'
      - 'admin-icon.png'

jobs:
  build:
    name: Build Kumaoni Potli Admin APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP NODE 20
      # ============================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ============================================================
      # 3. SETUP JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 4. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 5. SELECT CURRENT ADMIN HTML
      # ============================================================
      - name: Select current Admin HTML
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SELECTING CURRENT KUMAONI POTLI ADMIN PANEL"
          echo "=========================================="

          if [ ! -f "Kumaoni-Potli-Admin-CONNECTED.html" ]; then
            echo "ERROR: Kumaoni-Potli-Admin-CONNECTED.html was not found."
            echo ""
            echo "Files available in repository:"
            ls -lah
            exit 1
          fi

          cp "Kumaoni-Potli-Admin-CONNECTED.html" "index.html"

          echo "Admin HTML selected successfully."
          ls -lh index.html


      # ============================================================
      # 6. CREATE CAPACITOR PROJECT
      # ============================================================
      - name: Create Capacitor Admin project
        shell: bash
        run: |
          set -e

          echo "Creating Capacitor project..."

          mkdir -p capacitor-admin
          cd capacitor-admin

          npm init -y

          npm install \
            @capacitor/core@7.4.3 \
            @capacitor/cli@7.4.3 \
            @capacitor/android@7.4.3

          npm install \
            @capacitor/assets@3.0.5

          mkdir -p www
          mkdir -p resources

          cp ../index.html www/index.html

          if [ -f "../admin-icon.png" ]; then
            cp ../admin-icon.png resources/icon.png
          else
            echo "ERROR: admin-icon.png was not found."
            exit 1
          fi

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kumaonipotli.admin",
            "appName": "Kumaoni Potli Admin",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          echo "Capacitor project created."


      # ============================================================
      # 7. ADD ANDROID PLATFORM
      # ============================================================
      - name: Add Android platform
        working-directory: capacitor-admin
        shell: bash
        run: |
          set -e

          npx cap add android

          echo "Android platform added successfully."


      # ============================================================
      # 8. GENERATE ADMIN APP ICON
      # ============================================================
      - name: Configure Admin launcher icon
        working-directory: capacitor-admin
        shell: bash
        run: |
          set -e

          echo "Generating Kumaoni Potli Admin icon..."

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor "#123C32"

          echo "Admin icon generated."


      # ============================================================
      # 9. SET ADMIN APP NAME
      # ============================================================
      - name: Set Admin App Name
        working-directory: capacitor-admin
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/res/values/strings.xml")

          if p.exists():
              text = p.read_text()

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">Kumaoni Potli Admin</string>',
                  text
              )

              p.write_text(text)

          print("Admin app name configured.")
          PY


      # ============================================================
      # 10. SYNC CAPACITOR
      # ============================================================
      - name: Sync Capacitor
        working-directory: capacitor-admin
        shell: bash
        run: |
          set -e

          npx cap sync android

          echo "Capacitor sync completed."


      # ============================================================
      # 11. VERIFY ADMIN WEB FILE
      # ============================================================
      - name: Verify final Admin web file
        working-directory: capacitor-admin
        shell: bash
        run: |
          set -e

          echo "Checking final Admin web file..."

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html was not created."
            exit 1
          fi

          SIZE=$(wc -c < www/index.html)

          echo "Admin index.html size: ${SIZE} bytes"

          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: Admin HTML appears too small."
            exit 1
          fi

          echo "Admin web file verified."


      # ============================================================
      # 12. VERIFY ANDROID MANIFEST
      # ============================================================
      - name: Verify AndroidManifest.xml
        working-directory: capacitor-admin
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "AndroidManifest.xml verified."


      # ============================================================
      # 13. BUILD ADMIN APK
      # ============================================================
      - name: Build Admin APK
        working-directory: capacitor-admin/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

          echo "=========================================="
          echo "ADMIN APK BUILD COMPLETED"
          echo "=========================================="


      # ============================================================
      # 14. FIND APK
      # ============================================================
      - name: Find Admin APK
        working-directory: capacitor-admin
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find android/app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"


      # ============================================================
      # 15. RENAME APK
      # ============================================================
      - name: Rename Admin APK
        working-directory: capacitor-admin
        shell: bash
        run: |
          set -e

          mkdir -p final-apk

          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          cp "$APK" "final-apk/Kumaoni-Potli-Admin.apk"

          echo "Final APK:"
          ls -lh final-apk/Kumaoni-Potli-Admin.apk


      # ============================================================
      # 16. UPLOAD ADMIN APK
      # ============================================================
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: capacitor-admin/final-apk/Kumaoni-Potli-Admin.apk
          if-no-files-found: error


      # ============================================================
      # 17. FINAL VERIFICATION
      # ============================================================
      - name: Final Admin APK verification
        shell: bash
        run: |
          set -e

          if [ ! -f "capacitor-admin/final-apk/Kumaoni-Potli-Admin.apk" ]; then
            echo "ERROR: Final Admin APK not found."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "KUMAONI POTLI ADMIN APK READY"
          echo "=========================================="
          ls -lh capacitor-admin/final-apk/Kumaoni-Potli-Admin.apk
          echo ""
          echo "APK NAME:"
          echo "Kumaoni-Potli-Admin.apk"
          echo ""
          echo "=========================================="
