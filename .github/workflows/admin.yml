name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kumaoni Potli Admin APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ============================================================
      # 3. JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SETTING UP ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi

          if [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_SDK_ROOT" -maxdepth 5 -type f \
              -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager found:"
          echo "$SDKMANAGER"

          # Fix GitHub runner permission problem
          chmod +x "$SDKMANAGER"

          # Also fix all command line tools
          chmod -R u+rwX "$ANDROID_SDK_ROOT/cmdline-tools" || true

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK setup completed."


      # ============================================================
      # 5. SHOW REPOSITORY
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "KUMAONI POTLI ADMIN"
          echo "========================================"

          echo ""
          echo "Repository root:"
          ls -lah

          echo ""
          echo "HTML files:"
          find . -maxdepth 2 -type f \
            -iname "*.html" \
            -print

          echo ""
          echo "PNG files:"
          find . -maxdepth 2 -type f \
            -iname "*.png" \
            -print


      # ============================================================
      # 6. SELECT ADMIN HTML
      # ============================================================
      - name: Select Admin HTML
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SELECTING KUMAONI POTLI ADMIN PANEL"
          echo "========================================"

          ADMIN_HTML="Kumaoni-Potli-Admin-CONNECTED.html"

          if [ ! -f "$ADMIN_HTML" ]; then
            echo ""
            echo "ERROR: Admin HTML not found:"
            echo "$ADMIN_HTML"
            echo ""
            echo "Available Admin HTML files:"
            find . -maxdepth 2 -type f \
              -iname "*admin*.html" \
              -print
            exit 1
          fi

          echo ""
          echo "Admin HTML found:"
          ls -lh "$ADMIN_HTML"

          cp "$ADMIN_HTML" index.html

          echo ""
          echo "Created:"
          ls -lh index.html


      # ============================================================
      # 7. PREPARE WEB DIRECTORY
      # ============================================================
      - name: Prepare Admin web files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING ADMIN WEB FILES"
          echo "========================================"

          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          # Copy all common web assets
          find . -maxdepth 1 -type f \
            \( \
              -name "*.png" \
              -o -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.webp" \
              -o -name "*.gif" \
              -o -name "*.svg" \
              -o -name "*.ico" \
              -o -name "*.css" \
              -o -name "*.js" \
            \) \
            -exec cp -f {} www/ \;

          echo ""
          echo "Prepared web directory:"
          find www -maxdepth 1 -type f -print

          echo ""
          echo "Checking index.html..."

          test -s www/index.html

          echo "Admin HTML is ready."


      # ============================================================
      # 8. CREATE PACKAGE.JSON
      # ============================================================
      - name: Create Capacitor package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CREATING CAPACITOR PROJECT"
          echo "========================================"

          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-admin",
            "version": "1.0.0",
            "private": true,
            "description": "Kumaoni Potli Admin Panel",
            "scripts": {
              "build": "echo Kumaoni Potli Admin"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

          npm install

          echo "Capacitor packages installed."


      # ============================================================
      # 9. CREATE CAPACITOR CONFIG
      # ============================================================
      - name: Configure Capacitor
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING CAPACITOR"
          echo "========================================"

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.kumaonipotli.admin',
            appName: 'Kumaoni Potli Admin',
            webDir: 'www',
            bundledWebRuntime: false,

            server: {
              androidScheme: 'https'
            },

            android: {
              allowMixedContent: true,
              backgroundColor: '#F5FAF6'
            }
          };

          export default config;
          EOF

          echo "Capacitor configuration created."


      # ============================================================
      # 10. INITIALIZE CAPACITOR
      # ============================================================
      - name: Initialize Capacitor
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INITIALIZING CAPACITOR"
          echo "========================================"

          npx cap init \
            "Kumaoni Potli Admin" \
            "com.kumaonipotli.admin" \
            --web-dir=www

          echo "Capacitor initialized."


      # ============================================================
      # 11. ADD ANDROID
      # ============================================================
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ADDING ANDROID PLATFORM"
          echo "========================================"

          npx cap add android

          echo "Android platform added."


      # ============================================================
      # 12. COPY WEB FILES
      # ============================================================
      - name: Copy Admin web files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "COPYING ADMIN WEB FILES"
          echo "========================================"

          npx cap copy android

          echo ""
          echo "Checking final Android web files..."

          test -s \
            android/app/src/main/assets/public/index.html

          echo "Admin HTML copied successfully."


      # ============================================================
      # 13. ADMIN APP LOGO
      # ============================================================
      - name: Configure Admin App Logo
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING KUMAONI POTLI ADMIN LOGO"
          echo "========================================"

          ICON_SOURCE="admin-icon.png"

          if [ ! -f "$ICON_SOURCE" ]; then
            echo "WARNING: admin-icon.png not found."
            echo "Default Capacitor icon will be kept."
            exit 0
          fi

          echo "Admin icon found:"
          ls -lh "$ICON_SOURCE"

          mkdir -p android/app/src/main/res/drawable

          cp "$ICON_SOURCE" \
            android/app/src/main/res/drawable/kumaoni_potli_admin_logo.png

          echo "Admin logo copied."


      # ============================================================
      # 14. SET APP NAME
      # ============================================================
      - name: Set Kumaoni Potli Admin App Name
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SETTING APP NAME"
          echo "========================================"

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ ! -f "$STRINGS_FILE" ]; then
            mkdir -p android/app/src/main/res/values

            cat > "$STRINGS_FILE" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Kumaoni Potli Admin</string>
              <string name="title_activity_main">Kumaoni Potli Admin</string>
          </resources>
          EOF

          else

            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")

          if re.search(r'<string name="app_name">.*?</string>', s):
              s = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">Kumaoni Potli Admin</string>',
                  s
              )
          else:
              s = s.replace(
                  '</resources>',
                  '    <string name="app_name">Kumaoni Potli Admin</string>\n</resources>'
              )

          p.write_text(s, encoding="utf-8")
          PY

          fi

          echo ""
          cat "$STRINGS_FILE"


      # ============================================================
      # 15. ANDROID MANIFEST / PERMISSIONS
      # ============================================================
      - name: Configure Android permissions
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID PERMISSIONS"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          ]

          for perm in permissions:
              if perm not in s:
                  s = s.replace(
                      '<manifest',
                      '<manifest',
                      1
                  )
                  first_end = s.find('>')
                  if first_end != -1:
                      s = (
                          s[:first_end + 1]
                          + '\n    '
                          + perm
                          + s[first_end + 1:]
                      )

          p.write_text(s, encoding="utf-8")
          PY

          echo "Android permissions configured."


      # ============================================================
      # 16. CONFIGURE GRADLE SDK
      # ============================================================
      - name: Configure Android SDK version
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID SDK VERSION"
          echo "========================================"

          GRADLE_FILE="android/app/build.gradle"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          if "compileSdk" in s:
              import re
              s = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 35',
                  s
              )
              s = re.sub(
                  r'compileSdk\s+\d+',
                  'compileSdk 35',
                  s
              )

          if "targetSdk" in s:
              import re
              s = re.sub(
                  r'targetSdk\s*=\s*\d+',
                  'targetSdk = 35',
                  s
              )
              s = re.sub(
                  r'targetSdk\s+\d+',
                  'targetSdk 35',
                  s
              )

          p.write_text(s, encoding="utf-8")
          PY

          echo "Android SDK configuration completed."


      # ============================================================
      # 17. SYNC CAPACITOR
      # ============================================================
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SYNCING CAPACITOR"
          echo "========================================"

          npx cap sync android

          echo "Capacitor sync completed."


      # ============================================================
      # 18. VERIFY WEB FILE
      # ============================================================
      - name: Verify final Admin HTML
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ADMIN HTML"
          echo "========================================"

          FILE="android/app/src/main/assets/public/index.html"

          test -s "$FILE"

          echo "Admin HTML:"
          ls -lh "$FILE"

          echo ""
          echo "HTML verification successful."


      # ============================================================
      # 19. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          test -d android
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -s android/app/src/main/assets/public/index.html

          echo "Android project verification successful."


      # ============================================================
      # 20. BUILD APK
      # ============================================================
      - name: Build Kumaoni Potli Admin APK
        shell: bash
        working-directory: android
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KUMAONI POTLI ADMIN APK"
          echo "========================================"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

          echo ""
          echo "APK build completed."


      # ============================================================
      # 21. VERIFY APK
      # ============================================================
      - name: Verify Admin APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ADMIN APK"
          echo "========================================"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"


      # ============================================================
      # 22. PREPARE FINAL APK
      # ============================================================
      - name: Prepare Kumaoni Potli Admin APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING FINAL APK"
          echo "========================================"

          rm -rf release
          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/Kumaoni-Potli-Admin.apk

          echo ""
          echo "FINAL APK:"
          ls -lh release/Kumaoni-Potli-Admin.apk


      # ============================================================
      # 23. UPLOAD APK
      # ============================================================
      - name: Upload Kumaoni Potli Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: release/Kumaoni-Potli-Admin.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 24. BUILD COMPLETE
      # ============================================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "KUMAONI POTLI ADMIN BUILD COMPLETE"
          echo "========================================"
          echo ""
          echo "App Name:"
          echo "Kumaoni Potli Admin"
          echo ""
          echo "Package:"
          echo "com.kumaonipotli.admin"
          echo ""
          echo "APK:"
          echo "Kumaoni-Potli-Admin.apk"
          echo ""
          echo "Artifact:"
          echo "Kumaoni-Potli-Admin-APK"
          echo ""
          echo "========================================"
