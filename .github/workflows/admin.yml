name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Admin Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # 3. SETUP JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 4. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SETTING UP ANDROID SDK"
          echo "========================================"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          echo "Android SDK found."

          # Locate sdkmanager
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name "sdkmanager" -print
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          # Add Android tools to PATH
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          # Accept Android SDK licenses
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # Install only required modern Android packages.
          # IMPORTANT: Do NOT install the obsolete 'tools' package.
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android packages:"
          "$SDKMANAGER" --list_installed || true

      # ============================================================
      # 5. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING ANDROID SDK"
          echo "========================================"

          test -d "$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platform-tools"

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"

          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK verification successful."

      # ============================================================
      # 6. SELECT ADMIN HTML
      # ============================================================
      - name: Select Admin HTML
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SELECTING KUMAONI POTLI ADMIN"
          echo "========================================"

          ADMIN_HTML="Kumaoni-Potli-Admin-CONNECTED.html"

          echo "Repository root:"
          pwd

          echo ""
          echo "Available Admin HTML files:"

          find . -maxdepth 2 \
            -type f \
            -iname "*admin*.html" \
            -print

          if [ ! -f "$ADMIN_HTML" ]; then
            echo ""
            echo "::error::Admin HTML not found:"
            echo "$ADMIN_HTML"
            exit 1
          fi

          echo ""
          echo "Using Admin HTML:"
          echo "$ADMIN_HTML"

      # ============================================================
      # 7. PREPARE ADMIN WEB FILES
      # ============================================================
      - name: Prepare Admin web files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING ADMIN WEB FILES"
          echo "========================================"

          mkdir -p www

          cp \
            "Kumaoni-Potli-Admin-CONNECTED.html" \
            "www/index.html"

          # Copy images
          find . -maxdepth 1 -type f \
            \( \
              -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
              -o -iname "*.gif" \
              -o -iname "*.svg" \
              -o -iname "*.ico" \
            \) \
            -exec cp -t www/ {} +

          # Copy CSS and JS
          find . -maxdepth 1 -type f \
            \( \
              -iname "*.css" \
              -o -iname "*.js" \
            \) \
            -exec cp -t www/ {} +

          echo ""
          echo "Prepared Admin files:"
          ls -lah www

          test -s www/index.html

      # ============================================================
      # 8. CREATE CAPACITOR PROJECT
      # ============================================================
      - name: Configure Capacitor
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CONFIGURING CAPACITOR"
          echo "========================================"

          npm init -y

          npm install \
            @capacitor/core@^7 \
            @capacitor/android@^7

          npm install \
            --save-dev \
            @capacitor/cli@^7

          npx cap init \
            "Kumaoni Potli Admin" \
            "com.kumaonipotli.admin" \
            --web-dir=www

      # ============================================================
      # 9. ADD ANDROID PLATFORM
      # ============================================================
      - name: Add Android platform
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ADDING ANDROID PLATFORM"
          echo "========================================"

          npx cap add android

      # ============================================================
      # 10. CONFIGURE ANDROID SDK VERSION
      # ============================================================
      - name: Configure Android SDK version
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CONFIGURING ANDROID SDK VERSION"
          echo "========================================"

          if [ -f "android/variables.gradle" ]; then

            sed -i \
              's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' \
              android/variables.gradle || true

            sed -i \
              's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' \
              android/variables.gradle || true

          fi

          echo "Android SDK configuration completed."

      # ============================================================
      # 11. SYNC CAPACITOR
      # ============================================================
      - name: Sync Admin app
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SYNCING KUMAONI POTLI ADMIN"
          echo "========================================"

          npx cap sync android

      # ============================================================
      # 12. VERIFY ADMIN HTML
      # ============================================================
      - name: Verify final Admin web file
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING ADMIN HTML"
          echo "========================================"

          ADMIN_INDEX="android/app/src/main/assets/public/index.html"

          if [ ! -s "$ADMIN_INDEX" ]; then
            echo "::error::Final Admin index.html not found."
            exit 1
          fi

          echo "Admin HTML successfully copied."

          ls -lh "$ADMIN_INDEX"

      # ============================================================
      # 13. SET ADMIN APP NAME
      # ============================================================
      - name: Set Admin App Name
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SETTING ADMIN APP NAME"
          echo "========================================"

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ ! -f "$STRINGS_FILE" ]; then
            echo "::error::strings.xml not found."
            exit 1
          fi

          if grep -q 'name="app_name"' "$STRINGS_FILE"; then

            sed -i \
              's#<string name="app_name">[^<]*</string>#<string name="app_name">Kumaoni Potli Admin</string>#' \
              "$STRINGS_FILE"

          else

            sed -i \
              's#</resources>#    <string name="app_name">Kumaoni Potli Admin</string>\n</resources>#' \
              "$STRINGS_FILE"

          fi

          echo "App name:"
          grep 'app_name' "$STRINGS_FILE"

      # ============================================================
      # 14. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          test -f android/gradlew
          test -f android/app/build.gradle
          test -s android/app/src/main/assets/public/index.html

          echo "Android project verification successful."

      # ============================================================
      # 15. BUILD ADMIN APK
      # ============================================================
      - name: Build Admin APK
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING KUMAONI POTLI ADMIN APK"
          echo "========================================"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            assembleDebug \
            --stacktrace

      # ============================================================
      # 16. VERIFY APK
      # ============================================================
      - name: Verify Admin APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING ADMIN APK"
          echo "========================================"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Admin APK was not generated."

            echo ""
            echo "Available APK files:"
            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # ============================================================
      # 17. RENAME APK
      # ============================================================
      - name: Prepare Admin APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING FINAL ADMIN APK"
          echo "========================================"

          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/Kumaoni-Potli-Admin.apk

          ls -lh release/Kumaoni-Potli-Admin.apk

      # ============================================================
      # 18. UPLOAD APK
      # ============================================================
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: release/Kumaoni-Potli-Admin.apk
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 19. BUILD COMPLETE
      # ============================================================
      - name: Build Complete
        shell: bash
        run: |
          echo "========================================"
          echo "KUMAONI POTLI ADMIN BUILD COMPLETE"
          echo "========================================"
          echo ""
          echo "APK: Kumaoni-Potli-Admin.apk"
          echo ""
          echo "BUILD SUCCESSFUL"
