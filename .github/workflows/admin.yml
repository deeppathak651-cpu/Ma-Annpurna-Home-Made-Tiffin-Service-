name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ============================================================
      # 3. SETUP JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 4. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. SHOW REPOSITORY FILES
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          echo "========================================"
          echo "KUMAONI POTLI ADMIN BUILD"
          echo "========================================"

          echo ""
          echo "Repository root files:"
          ls -lah

          echo ""
          echo "HTML files:"
          find . -maxdepth 2 -type f \
            \( -name "*.html" -o -name "*.json" -o -name "*.png" \) \
            -print

      # ============================================================
      # 6. SELECT CURRENT ADMIN PANEL
      # ============================================================
      - name: Select current Admin Panel
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SELECTING CURRENT ADMIN PANEL"
          echo "========================================"

          ADMIN_HTML="Kumaoni-Potli-Admin-CONNECTED.html"

          if [ ! -f "$ADMIN_HTML" ]; then
            echo ""
            echo "ERROR: $ADMIN_HTML was not found."
            echo ""
            echo "Available Admin files:"
            find . -maxdepth 1 -type f \
              -iname "*Admin*.html" \
              -print
            exit 1
          fi

          echo ""
          echo "Admin HTML found:"
          echo "$ADMIN_HTML"

          cp "$ADMIN_HTML" index.html

          echo ""
          echo "Admin panel copied to:"
          echo "index.html"

          ls -lh index.html

      # ============================================================
      # 7. CREATE CAPACITOR PROJECT
      # ============================================================
      - name: Create Capacitor Admin project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CREATING CAPACITOR ADMIN PROJECT"
          echo "========================================"

          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-admin",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Kumaoni Potli Admin build"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

          npm install

          npx cap init "Kumaoni Potli Admin" "com.kumaonipotli.admin" --web-dir=.

      # ============================================================
      # 8. ADD ANDROID PLATFORM
      # ============================================================
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ADDING ANDROID PLATFORM"
          echo "========================================"

          npx cap add android

      # ============================================================
      # 9. COPY WEB FILES
      # ============================================================
      - name: Copy Admin web files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "COPYING ADMIN WEB FILES"
          echo "========================================"

          npx cap copy android

      # ============================================================
      # 10. UPDATE CAPACITOR
      # ============================================================
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SYNC CAPACITOR"
          echo "========================================"

          npx cap sync android

      # ============================================================
      # 11. VERIFY ADMIN HTML
      # ============================================================
      - name: Verify final Admin web file
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING FINAL ADMIN HTML"
          echo "========================================"

          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "ERROR: Final Admin index.html not found."
            exit 1
          fi

          echo "Final Admin HTML exists."

          ls -lh android/app/src/main/assets/public/index.html

      # ============================================================
      # 12. SET ADMIN APP NAME
      # ============================================================
      - name: Set Admin App Name
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SETTING ADMIN APP NAME"
          echo "========================================"

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS_FILE" ]; then
            sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Kumaoni Potli Admin</string>#' "$STRINGS_FILE"
          fi

          echo "Admin app name set to Kumaoni Potli Admin."

      # ============================================================
      # 13. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "Android project verification successful."

      # ============================================================
      # 14. BUILD ADMIN APK
      # ============================================================
      - name: Build Admin APK
        shell: bash
        working-directory: android
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KUMAONI POTLI ADMIN APK"
          echo "========================================"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      # ============================================================
      # 15. FIND APK
      # ============================================================
      - name: Find Admin APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR ADMIN APK"
          echo "========================================"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 16. RENAME ADMIN APK
      # ============================================================
      - name: Rename Admin APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RENAMING ADMIN APK"
          echo "========================================"

          mkdir -p release

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Admin APK was not generated."
            exit 1
          fi

          cp "$APK" \
            "release/Kumaoni-Potli-Admin.apk"

          echo "Final APK:"
          ls -lh release/Kumaoni-Potli-Admin.apk

      # ============================================================
      # 17. UPLOAD ADMIN APK
      # ============================================================
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: release/Kumaoni-Potli-Admin.apk
          if-no-files-found: error

      # ============================================================
      # 18. BUILD COMPLETE
      # ============================================================
      - name: Build Complete
        shell: bash
        run: |
          echo "========================================"
          echo "KUMAONI POTLI ADMIN BUILD COMPLETE"
          echo "========================================"
          echo ""
          echo "APK: Kumaoni-Potli-Admin.apk"
          echo ""
          echo "Build finished successfully."
