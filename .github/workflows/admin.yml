
name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Admin Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Find the actual Admin HTML
      - name: Select Admin HTML
        shell: bash
        run: |
          set -euo pipefail

          ADMIN_HTML="Kumaoni-Potli-Admin-CONNECTED.html"

          echo "Repository root:"
          pwd

          echo "Available Admin HTML files:"
          find . -maxdepth 2 -type f -iname '*admin*.html' -print

          if [ ! -f "$ADMIN_HTML" ]; then
            echo "::error::Admin HTML not found: $ADMIN_HTML"
            echo "Check the filename and repository location."
            exit 1
          fi

          echo "Using Admin HTML: $ADMIN_HTML"

      # 6. Prepare clean web directory and assets
      - name: Prepare Admin web files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p www

          cp "Kumaoni-Potli-Admin-CONNECTED.html" \
             "www/index.html"

          # Copy root-level images used by the HTML
          find . -maxdepth 1 -type f \
            \( -iname '*.png' \
            -o -iname '*.jpg' \
            -o -iname '*.jpeg' \
            -o -iname '*.webp' \
            -o -iname '*.gif' \
            -o -iname '*.svg' \
            -o -iname '*.ico' \) \
            -exec cp -t www/ {} +

          # Copy root-level CSS and JavaScript, if present
          find . -maxdepth 1 -type f \
            \( -iname '*.css' -o -iname '*.js' \) \
            -exec cp -t www/ {} +

          echo "Prepared web files:"
          ls -lah www

          test -s www/index.html

      # 7. Create the Capacitor project
      - name: Configure Capacitor
        shell: bash
        run: |
          set -euo pipefail

          npm init -y

          npm install \
            @capacitor/core@^7 \
            @capacitor/android@^7

          npm install --save-dev @capacitor/cli@^7

          npx cap init \
            "Kumaoni Potli Admin" \
            "com.kumaonipotli.admin" \
            --web-dir=www

      # 8. Generate Android project
      - name: Add Android platform
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android

      # 9. Copy web app and sync
      - name: Sync Admin app
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

          test -s \
            android/app/src/main/assets/public/index.html

          echo "Admin HTML successfully copied into Android."

      # 10. Set application display name
      - name: Set Admin App Name
        shell: bash
        run: |
          set -euo pipefail

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS_FILE" ]; then
            if grep -q 'name="app_name"' "$STRINGS_FILE"; then
              sed -i \
                's#<string name="app_name">[^<]*</string>#<string name="app_name">Kumaoni Potli Admin</string>#' \
                "$STRINGS_FILE"
            else
              sed -i \
                's#</resources>#    <string name="app_name">Kumaoni Potli Admin</string>\n</resources>#' \
                "$STRINGS_FILE"
            fi
          else
            echo "::error::Android strings.xml not found."
            exit 1
          fi

      # 11. Verify Android project
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/app/build.gradle
          test -s android/app/src/main/assets/public/index.html

          echo "Android project verification passed."

      # 12. Build debug APK
      - name: Build Admin APK
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            assembleDebug \
            --stacktrace

      # 13. Verify and rename APK
      - name: Prepare Admin APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            find android/app/build/outputs -type f -name '*.apk' -print
            exit 1
          fi

          mkdir -p release

          cp "$APK" "release/Kumaoni-Potli-Admin.apk"

          ls -lh release/Kumaoni-Potli-Admin.apk

      # 14. Upload downloadable APK
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: release/Kumaoni-Potli-Admin.apk
          if-no-files-found: error
          retention-days: 7
