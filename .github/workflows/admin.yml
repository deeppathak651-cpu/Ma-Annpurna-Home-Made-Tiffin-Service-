name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kumaoni Potli Admin Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Android SDK:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."

      # ============================================================
      # 5. SHOW REPOSITORY
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY FILES"
          echo "=========================================="

          ls -lah

          echo ""
          echo "Admin HTML files:"
          find . -maxdepth 2 -type f \
            -iname "*admin*.html" \
            -print

          echo ""
          echo "Image files:"
          find . -maxdepth 2 -type f \
            \( \
              -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
              -o -iname "*.svg" \
            \) \
            -print

      # ============================================================
      # 6. SELECT ADMIN HTML
      # ============================================================
      - name: Select Admin HTML
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SELECTING KUMAONI POTLI ADMIN PANEL"
          echo "=========================================="

          ADMIN_HTML=""

          # New fixed file is preferred.
          if [ -f "Kumaoni-Potli-Admin-FIXED.html" ]; then
            ADMIN_HTML="Kumaoni-Potli-Admin-FIXED.html"

          elif [ -f "Kumaoni-Potli-Admin-FIXED-FIREBASE-DATA-BLANK-SCREEN-FIX.html" ]; then
            ADMIN_HTML="Kumaoni-Potli-Admin-FIXED-FIREBASE-DATA-BLANK-SCREEN-FIX.html"

          elif [ -f "Kumaoni-Potli-Admin-CONNECTED.html" ]; then
            ADMIN_HTML="Kumaoni-Potli-Admin-CONNECTED.html"

          else
            echo "ERROR: No Admin HTML file found."

            echo ""
            echo "Available Admin files:"
            find . -maxdepth 2 -type f \
              -iname "*admin*.html" \
              -print

            exit 1
          fi

          echo "Using Admin HTML:"
          echo "$ADMIN_HTML"

          rm -rf www
          mkdir -p www

          cp "$ADMIN_HTML" www/index.html

          test -s www/index.html

          echo ""
          echo "Admin HTML copied successfully:"
          ls -lh www/index.html

      # ============================================================
      # 7. COPY ADMIN ASSETS
      # ============================================================
      - name: Copy Admin assets
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COPYING ADMIN ASSETS"
          echo "=========================================="

          find . -maxdepth 1 -type f \
            \( \
              -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
              -o -iname "*.svg" \
            \) \
            -exec cp -f {} www/ \;

          echo ""
          echo "Web assets:"
          find www -maxdepth 1 -type f -print

      # ============================================================
      # 8. VERIFY ADMIN LOGO
      # ============================================================
      - name: Verify Admin Logo
        shell: bash
        run: |
          set -e

          if [ -f "admin-icon.png" ]; then
            echo "admin-icon.png found."
            ls -lh admin-icon.png
          else
            echo "WARNING: admin-icon.png not found."
          fi

      # ============================================================
      # 9. CREATE PACKAGE.JSON
      # ============================================================
      - name: Create Capacitor package
        shell: bash
        run: |
          set -e

          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-admin",
            "version": "1.0.0",
            "private": true,
            "description": "Kumaoni Potli Admin Panel",
            "scripts": {
              "build": "echo Kumaoni Potli Admin"
            },
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF

          npm install --no-audit --no-fund

          echo "Node dependencies installed."

      # ============================================================
      # 10. INITIALIZE CAPACITOR
      # ============================================================
      - name: Initialize Capacitor
        shell: bash
        run: |
          set -e

          npx cap init \
            "Kumaoni Potli" \
            "com.kumaonipotli.admin" \
            --web-dir=www

      # ============================================================
      # 11. ADD ANDROID
      # ============================================================
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          npx cap add android

      # ============================================================
      # 12. CONFIGURE ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          APP_GRADLE="android/app/build.gradle"

          if [ -f "$APP_GRADLE" ]; then

            sed -i \
              's/compileSdk [0-9][0-9]*/compileSdk 35/g' \
              "$APP_GRADLE" || true

            sed -i \
              's/targetSdk [0-9][0-9]*/targetSdk 35/g' \
              "$APP_GRADLE" || true

          fi

          echo "Android SDK configuration completed."

      # ============================================================
      # 13. FIX KOTLIN DUPLICATE CLASSES
      # ============================================================
      - name: Fix Kotlin duplicate dependencies
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIXING KOTLIN DUPLICATE DEPENDENCIES"
          echo "=========================================="

          cat >> android/build.gradle <<'EOF'

          // ==========================================================
          // Kumaoni Potli Kotlin dependency resolution
          // ==========================================================

          allprojects {
              configurations.configureEach {

                  // Remove old Kotlin JDK bridge artifacts.
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

                  resolutionStrategy {
                      // Keep one Kotlin stdlib version.
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"

                      eachDependency { details ->
                          if (details.requested.group == "org.jetbrains.kotlin" &&
                              details.requested.name in [
                                  "kotlin-stdlib",
                                  "kotlin-stdlib-common",
                                  "kotlin-stdlib-jdk7",
                                  "kotlin-stdlib-jdk8"
                              ]) {
                              details.useVersion("1.8.22")
                              details.because("Kumaoni Potli Kotlin dependency alignment")
                          }
                      }
                  }
              }
          }
          EOF

          echo ""
          echo "Kotlin dependency resolution configured."

      # ============================================================
      # 14. SHOW KOTLIN DEPENDENCIES
      # ============================================================
      - name: Check Kotlin dependencies
        shell: bash
        working-directory: android
        run: |
          set +e

          chmod +x gradlew

          echo "=========================================="
          echo "CHECKING KOTLIN DEPENDENCIES"
          echo "=========================================="

          ./gradlew \
            app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon \
            > kotlin-dependencies.txt 2>&1

          grep -i "kotlin-stdlib" kotlin-dependencies.txt || true

          echo ""
          echo "Kotlin dependency check completed."

      # ============================================================
      # 15. SET APPLICATION NAME
      # ============================================================
      - name: Set Kumaoni Potli App Name
        shell: bash
        run: |
          set -e

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ ! -f "$STRINGS_FILE" ]; then
            echo "ERROR: strings.xml not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/res/values/strings.xml")
          s = p.read_text()

          s = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">Kumaoni Potli</string>',
              s
          )

          p.write_text(s)
          PY

          echo "App name set to Kumaoni Potli."

      # ============================================================
      # 16. INSTALL ADMIN APP ICON
      # ============================================================
      - name: Install Admin App Logo
        shell: bash
        run: |
          set -e

          if [ ! -f "admin-icon.png" ]; then
            echo "WARNING: admin-icon.png not found."
            exit 0
          fi

          mkdir -p android/app/src/main/res/drawable

          cp "admin-icon.png" \
            android/app/src/main/res/drawable/kumaoni_potli_admin_logo.png

          echo "Admin logo installed."

      # ============================================================
      # 17. CONFIGURE LAUNCHER ICON
      # ============================================================
      - name: Set Android Launcher Icon
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(
              r'android:icon="@[^"]+"',
              'android:icon="@drawable/kumaoni_potli_admin_logo"',
              s,
              count=1
          )

          p.write_text(s)
          PY

          echo "Launcher icon configured."

      # ============================================================
      # 18. CAPACITOR SYNC
      # ============================================================
      - name: Sync Kumaoni Potli Admin
        shell: bash
        run: |
          set -e

          npx cap sync android

      # ============================================================
      # 19. VERIFY WEB FILE
      # ============================================================
      - name: Verify final Admin web file
        shell: bash
        run: |
          set -e

          FILE="android/app/src/main/assets/public/index.html"

          if [ ! -s "$FILE" ]; then
            echo "ERROR: Admin index.html missing."
            exit 1
          fi

          echo "Final Admin HTML:"
          ls -lh "$FILE"

      # ============================================================
      # 20. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/assets/public/index.html

          echo "Android project verification successful."

      # ============================================================
      # 21. SHOW VERSIONS
      # ============================================================
      - name: Show build versions
        shell: bash
        run: |
          echo "=========================================="
          echo "CAPACITOR VERSION"
          echo "=========================================="

          npx cap --version

          echo ""
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          cd android
          ./gradlew --version

      # ============================================================
      # 22. CLEAN ANDROID BUILD
      # ============================================================
      - name: Clean Android build
        shell: bash
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean --no-daemon

      # ============================================================
      # 23. BUILD APK
      # ============================================================
      - name: Build Kumaoni Potli Admin APK
        shell: bash
        working-directory: android
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING KUMAONI POTLI ADMIN APK"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 24. VERIFY APK
      # ============================================================
      - name: Verify Admin APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."

            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # ============================================================
      # 25. RENAME APK
      # ============================================================
      - name: Prepare Kumaoni Potli APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/Kumaoni-Potli-Admin.apk

          ls -lh release/Kumaoni-Potli-Admin.apk

      # ============================================================
      # 26. UPLOAD APK
      # ============================================================
      - name: Upload Kumaoni Potli Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin
          path: release/Kumaoni-Potli-Admin.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 27. COMPLETE
      # ============================================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "KUMAONI POTLI ADMIN APK BUILD COMPLETE"
          echo "=========================================="
          echo ""
          echo "APP NAME: Kumaoni Potli"
          echo "PACKAGE: com.kumaonipotli.admin"
          echo "APK: Kumaoni-Potli-Admin.apk"
          echo ""
          echo "Build completed successfully."
