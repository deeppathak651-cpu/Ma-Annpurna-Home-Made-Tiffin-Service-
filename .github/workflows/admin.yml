name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-admin-apk:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:

      # 1. Source Code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Check files
      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo "===== ADMIN FILE ====="
          if [ -f admin.html ]; then
            echo "admin.html FOUND"
          else
            echo "ERROR: admin.html NOT FOUND"
            exit 1
          fi

      # 5. Create web folder
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp admin.html www/index.html

          echo "===== WWW FILES ====="
          ls -la www

      # 6. Create package.json if missing
      - name: Prepare Node project
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          cat package.json

      # 7. Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      # 8. Create Capacitor config
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.kumaonijayka.admin',
            appName: 'Kumaoni Potli Admin',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

          cat capacitor.config.ts

      # 9. Create Android project
      - name: Create Android project
        run: |
          npx cap add android

      # 10. Copy web files
      - name: Sync web files
        run: |
          npx cap copy android

      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 12. Give Gradle permission
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      # 13. Build APK
      - name: Build Admin APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 14. Find APK
      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find android -type f -name "*.apk"

      # 15. Rename APK
      - name: Rename Admin APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/Kumaoni-Potli-Admin.apk

          ls -lh output/Kumaoni-Potli-Admin.apk

      # 16. Upload APK
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: output/Kumaoni-Potli-Admin.apk
          if-no-files-found: error

      # 17. Finish
      - name: Build Complete
        run: |
          echo "======================================"
          echo "KUMAONI POTLI ADMIN APK BUILD DONE"
          echo "======================================"
