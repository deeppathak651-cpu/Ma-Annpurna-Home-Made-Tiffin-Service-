name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-admin",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            }
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install
                - name: Install Capacitor Assets
        run: npm install @capacitor/assets --save-dev

      - name: Set Admin Panel App Icon
        run: |
          mkdir -p resources
          cp admin-icon.png resources/icon.png
          npx capacitor-assets generate --android

      - name: Prepare Admin HTML
        run: |
          rm -rf www
          mkdir -p www

          FILE="Kumaoni-Potli-ADMIN-FINAL-CORRECTED.html"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Admin HTML file not found"
            echo "Available HTML files:"
            find . -maxdepth 1 -type f -name '*.html' -print
            exit 1
          fi

          echo "Using Admin file:"
          echo "$FILE"

          cp "$FILE" www/index.html

          ls -lh www/index.html

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.annapurna.admin",
            "appName": "Kumaoni Potli Admin",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Copy Firebase configuration
        run: |
          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json not found"
            exit 1
          fi

          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Verify Admin Firebase package
        run: |
          echo "Firebase Android packages:"
          grep -n '"package_name"' google-services.json || true

          if ! grep -q '"package_name": "com.annapurna.admin"' google-services.json; then
            echo "ERROR: com.annapurna.admin is missing from google-services.json"
            exit 1
          fi

          echo "Admin Firebase package verified successfully."

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
              }
          }
          EOF

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify Admin Android project
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Kumaoni Potli Admin APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify Admin APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Admin APK was not created"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Kumaoni Potli Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
