name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Admin Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ============================================================
      # 3. JAVA 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 4. CONFIGURE EXISTING ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SETTING UP ANDROID SDK"
          echo "========================================"

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK="$ANDROID_HOME"
          else
            SDK="/usr/local/lib/android/sdk"
          fi

          echo "Android SDK:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo ""
          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK" \
              -type f \
              -name sdkmanager \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$SDK" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager found:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          SDK_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDK_DIR" >> "$GITHUB_PATH"

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK setup completed."

          echo ""
          echo "Installed SDK packages:"
          "$SDKMANAGER" --list_installed || true


      # ============================================================
      # 5. SHOW REPOSITORY
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "KUMAONI POTLI ADMIN BUILD"
          echo "========================================"

          echo ""
          echo "Repository root:"
          pwd

          echo ""
          echo "Repository files:"
          ls -lah

          echo ""
          echo "HTML files:"
          find . -maxdepth 2 -type f -iname "*.html" -print


      # ============================================================
      # 6. SELECT ADMIN HTML
      # ============================================================
      - name: Select Admin HTML
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SELECTING KUMAONI POTLI ADMIN PANEL"
          echo "========================================"

          ADMIN_HTML="Kumaoni-Potli-Admin-CONNECTED.html"

          if [ ! -f "$ADMIN_HTML" ]; then
            echo ""
            echo "ERROR: Admin HTML not found:"
            echo "$ADMIN_HTML"
            echo ""
            echo "Available HTML files:"
            find . -maxdepth 1 -type f -iname "*.html" -print
            exit 1
          fi

          echo ""
          echo "Admin HTML found:"
          echo "$ADMIN_HTML"

          mkdir -p www

          cp "$ADMIN_HTML" "www/index.html"

          echo ""
          echo "Admin HTML copied to:"
          echo "www/index.html"

          test -s "www/index.html"

          ls -lh "www/index.html"


      # ============================================================
      # 7. COPY ADMIN ASSETS
      # ============================================================
      - name: Copy Admin assets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "COPYING ADMIN ASSETS"
          echo "========================================"

          # Copy root-level image assets if they exist
          find . -maxdepth 1 -type f \
            \( \
              -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
              -o -iname "*.gif" \
              -o -iname "*.svg" \
              -o -iname "*.ico" \
            \) \
            -exec cp -f {} www/ \;

          # Copy JS/CSS files from repository root
          find . -maxdepth 1 -type f \
            \( \
              -iname "*.css" \
              -o -iname "*.js" \
            \) \
            -exec cp -f {} www/ \;

          echo ""
          echo "Prepared web files:"
          find www -maxdepth 1 -type f -print

          test -s "www/index.html"


      # ============================================================
      # 8. CREATE PACKAGE.JSON
      # ============================================================
      - name: Create Capacitor package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CREATING CAPACITOR PACKAGE"
          echo "========================================"

          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-admin",
            "version": "1.0.0",
            "private": true,
            "description": "Kumaoni Potli Admin Panel",
            "scripts": {
              "build": "echo Kumaoni Potli Admin"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

          npm install


      # ============================================================
      # 9. INITIALIZE CAPACITOR
      # ============================================================
      - name: Configure Capacitor
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING CAPACITOR"
          echo "========================================"

          npx cap init \
            "Kumaoni Potli Admin" \
            "com.kumaonipotli.admin" \
            --web-dir=www

          echo ""
          echo "Capacitor configuration created."

          cat capacitor.config.ts 2>/dev/null || \
          cat capacitor.config.json 2>/dev/null || true


      # ============================================================
      # 10. ADD ANDROID
      # ============================================================
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ADDING ANDROID PLATFORM"
          echo "========================================"

          npx cap add android


      # ============================================================
      # 11. COPY AND SYNC
      # ============================================================
      - name: Sync Admin app
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SYNCING ADMIN APP"
          echo "========================================"

          npx cap sync android


      # ============================================================
      # 12. VERIFY FINAL ADMIN HTML
      # ============================================================
      - name: Verify final Admin HTML
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ADMIN HTML"
          echo "========================================"

          ADMIN_WEB="android/app/src/main/assets/public/index.html"

          if [ ! -f "$ADMIN_WEB" ]; then
            echo "ERROR: Admin index.html was not copied."
            exit 1
          fi

          if [ ! -s "$ADMIN_WEB" ]; then
            echo "ERROR: Admin index.html is empty."
            exit 1
          fi

          echo "Admin HTML successfully copied."

          ls -lh "$ADMIN_WEB"


      # ============================================================
      # 13. SET ADMIN APP NAME
      # ============================================================
      - name: Set Admin App Name
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SETTING ADMIN APP NAME"
          echo "========================================"

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ ! -f "$STRINGS_FILE" ]; then
            echo "ERROR: strings.xml not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/res/values/strings.xml")
          text = path.read_text()

          import re

          if re.search(r'<string\s+name="app_name">.*?</string>', text):
              text = re.sub(
                  r'<string\s+name="app_name">.*?</string>',
                  '<string name="app_name">Kumaoni Potli Admin</string>',
                  text
              )
          else:
              text = text.replace(
                  '</resources>',
                  '    <string name="app_name">Kumaoni Potli Admin</string>\n</resources>'
              )

          path.write_text(text)
          PY

          echo ""
          echo "Admin app name:"
          grep 'app_name' "$STRINGS_FILE"


      # ============================================================
      # 14. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          test -d android
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/assets/public/index.html

          chmod +x android/gradlew

          echo ""
          echo "Android project verification successful."


      # ============================================================
      # 15. BUILD ADMIN APK
      # ============================================================
      - name: Build Admin APK
        shell: bash
        working-directory: android
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KUMAONI POTLI ADMIN APK"
          echo "========================================"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

          echo ""
          echo "Gradle build completed."


      # ============================================================
      # 16. VERIFY APK
      # ============================================================
      - name: Verify Admin APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ADMIN APK"
          echo "========================================"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Admin APK was not generated."

            echo ""
            echo "Available APK files:"
            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK generated successfully:"
          ls -lh "$APK"


      # ============================================================
      # 17. PREPARE FINAL APK
      # ============================================================
      - name: Prepare Admin APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING FINAL ADMIN APK"
          echo "========================================"

          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/Kumaoni-Potli-Admin.apk

          echo ""
          echo "Final APK:"
          ls -lh release/Kumaoni-Potli-Admin.apk


      # ============================================================
      # 18. UPLOAD APK
      # ============================================================
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: release/Kumaoni-Potli-Admin.apk
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 19. BUILD COMPLETE
      # ============================================================
      - name: Build Complete
        shell: bash
        run: |
          echo "========================================"
          echo "KUMAONI POTLI ADMIN BUILD COMPLETE"
          echo "========================================"
          echo ""
          echo "APK: Kumaoni-Potli-Admin.apk"
          echo ""
          echo "BUILD SUCCESSFUL"
