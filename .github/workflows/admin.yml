name: Build Kumaoni Potli Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kumaoni Potli Admin Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE.JS
      # IMPORTANT:
      # No npm cache is used because repository may not have lock file.
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SETTING UP ANDROID SDK"
          echo "=========================================="

          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager found:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."

      # ============================================================
      # 5. SHOW REPOSITORY
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY FILES"
          echo "=========================================="

          echo "Root:"
          ls -lah

          echo ""
          echo "HTML files:"
          find . -maxdepth 2 -type f -iname "*.html" -print

          echo ""
          echo "PNG files:"
          find . -maxdepth 2 -type f -iname "*.png" -print

      # ============================================================
      # 6. SELECT ADMIN HTML
      # ============================================================
      - name: Select Admin HTML
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SELECTING KUMAONI POTLI ADMIN PANEL"
          echo "=========================================="

          ADMIN_HTML="Kumaoni-Potli-Admin-CONNECTED.html"

          if [ ! -f "$ADMIN_HTML" ]; then
            echo "ERROR: $ADMIN_HTML not found."

            echo ""
            echo "Available Admin HTML files:"
            find . -maxdepth 2 -type f \
              -iname "*admin*.html" \
              -print

            exit 1
          fi

          echo "Using:"
          echo "$ADMIN_HTML"

          rm -rf www
          mkdir -p www

          cp "$ADMIN_HTML" www/index.html

          echo ""
          echo "Admin HTML copied successfully."

          test -s www/index.html

      # ============================================================
      # 7. COPY ADMIN LOGO / IMAGES
      # ============================================================
      - name: Copy Admin assets
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COPYING ADMIN ASSETS"
          echo "=========================================="

          # Copy all root PNG/JPG/JPEG/WebP assets.
          find . -maxdepth 1 -type f \
            \( \
              -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
              -o -iname "*.svg" \
            \) \
            -exec cp -f {} www/ \;

          echo ""
          echo "Web assets:"
          find www -maxdepth 1 -type f -print

      # ============================================================
      # 8. VERIFY ADMIN LOGO
      # ============================================================
      - name: Verify Admin Logo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ADMIN LOGO"
          echo "=========================================="

          if [ -f "admin-icon.png" ]; then
            echo "admin-icon.png found."
            ls -lh admin-icon.png
          else
            echo "WARNING: admin-icon.png not found."
            echo "The APK will still be built."
          fi

      # ============================================================
      # 9. CREATE PACKAGE.JSON
      # ============================================================
      - name: Create Capacitor package
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CREATING CAPACITOR PACKAGE"
          echo "=========================================="

          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-admin",
            "version": "1.0.0",
            "private": true,
            "description": "Kumaoni Potli Admin Panel",
            "scripts": {
              "build": "echo Kumaoni Potli Admin"
            },
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF

          npm install --no-audit --no-fund

          echo ""
          echo "Node dependencies installed."

      # ============================================================
      # 10. INITIALIZE CAPACITOR
      # ============================================================
      - name: Initialize Capacitor
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INITIALIZING CAPACITOR"
          echo "=========================================="

          npx cap init \
            "Kumaoni Potli" \
            "com.kumaonipotli.admin" \
            --web-dir=www

      # ============================================================
      # 11. ADD ANDROID
      # ============================================================
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ADDING ANDROID PLATFORM"
          echo "=========================================="

          npx cap add android

      # ============================================================
      # 12. CONFIGURE ANDROID SDK VERSION
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURING ANDROID"
          echo "=========================================="

          APP_GRADLE="android/app/build.gradle"

          if [ -f "$APP_GRADLE" ]; then

            sed -i \
              's/compileSdk [0-9][0-9]*/compileSdk 35/g' \
              "$APP_GRADLE" || true

            sed -i \
              's/targetSdk [0-9][0-9]*/targetSdk 35/g' \
              "$APP_GRADLE" || true

          fi

          echo "Android configuration completed."

      # ============================================================
      # 13. FIX KOTLIN DUPLICATE DEPENDENCIES
      # ============================================================
      - name: Fix Kotlin duplicate dependencies
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIXING KOTLIN DEPENDENCIES"
          echo "=========================================="

          cat >> android/build.gradle <<'EOF'

          // Kumaoni Potli Kotlin dependency cleanup
          subprojects {
              configurations.configureEach {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
                  }
              }
          }
          EOF

          echo "Kotlin duplicate dependency protection added."

      # ============================================================
      # 14. SET APPLICATION NAME
      # ============================================================
      - name: Set Kumaoni Potli App Name
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SETTING APP NAME"
          echo "=========================================="

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ ! -f "$STRINGS_FILE" ]; then
            echo "ERROR: strings.xml not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/strings.xml")
          s = p.read_text()

          import re

          s = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">Kumaoni Potli</string>',
              s
          )

          p.write_text(s)
          PY

          cat "$STRINGS_FILE"

      # ============================================================
      # 15. INSTALL ADMIN APP ICON
      # ============================================================
      - name: Install Admin App Logo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING KUMAONI POTLI ADMIN LOGO"
          echo "=========================================="

          if [ ! -f "admin-icon.png" ]; then
            echo "WARNING: admin-icon.png not found."
            echo "Using default Capacitor icon."
            exit 0
          fi

          ICON="admin-icon.png"

          mkdir -p android/app/src/main/res/drawable

          cp "$ICON" \
            android/app/src/main/res/drawable/kumaoni_potli_admin_logo.png

          echo "Admin logo copied."

          ls -lh \
            android/app/src/main/res/drawable/kumaoni_potli_admin_logo.png

      # ============================================================
      # 16. CONFIGURE LAUNCHER ICON
      # ============================================================
      - name: Set Android Launcher Icon
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SETTING ANDROID LAUNCHER ICON"
          echo "=========================================="

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(
              r'android:icon="@[^"]+"',
              'android:icon="@drawable/kumaoni_potli_admin_logo"',
              s,
              count=1
          )

          p.write_text(s)
          PY

          echo "Launcher icon configured."

      # ============================================================
      # 17. CAPACITOR SYNC
      # ============================================================
      - name: Sync Kumaoni Potli Admin
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SYNCING CAPACITOR"
          echo "=========================================="

          npx cap sync android

      # ============================================================
      # 18. VERIFY WEB FILE
      # ============================================================
      - name: Verify final Admin web file
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ADMIN WEB FILE"
          echo "=========================================="

          FILE="android/app/src/main/assets/public/index.html"

          if [ ! -s "$FILE" ]; then
            echo "ERROR: Admin index.html missing."
            exit 1
          fi

          echo "Admin index.html:"
          ls -lh "$FILE"

      # ============================================================
      # 19. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ANDROID PROJECT"
          echo "=========================================="

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/assets/public/index.html

          echo "Android project verification successful."

      # ============================================================
      # 20. SHOW CAPACITOR VERSION
      # ============================================================
      - name: Show Capacitor version
        shell: bash
        run: |
          npx cap --version
          cd android
          ./gradlew --version

      # ============================================================
      # 21. CLEAN ANDROID BUILD
      # ============================================================
      - name: Clean Android build
        shell: bash
        working-directory: android
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING ANDROID BUILD"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew clean --no-daemon

      # ============================================================
      # 22. BUILD APK
      # ============================================================
      - name: Build Kumaoni Potli Admin APK
        shell: bash
        working-directory: android
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING KUMAONI POTLI ADMIN APK"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 23. VERIFY APK
      # ============================================================
      - name: Verify Admin APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING APK"
          echo "=========================================="

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."

            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # ============================================================
      # 24. RENAME APK
      # ============================================================
      - name: Prepare Kumaoni Potli APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PREPARING FINAL APK"
          echo "=========================================="

          mkdir -p release

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            release/Kumaoni-Potli-Admin.apk

          ls -lh release/Kumaoni-Potli-Admin.apk

      # ============================================================
      # 25. UPLOAD APK
      # ============================================================
      - name: Upload Kumaoni Potli Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin
          path: release/Kumaoni-Potli-Admin.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 26. COMPLETE
      # ============================================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "KUMAONI POTLI ADMIN APK BUILD COMPLETE"
          echo "=========================================="
          echo ""
          echo "APP NAME: Kumaoni Potli"
          echo "PACKAGE: com.kumaonipotli.admin"
          echo "APK: Kumaoni-Potli-Admin.apk"
          echo ""
          echo "Download the APK from GitHub Actions Artifacts."
          echo ""
