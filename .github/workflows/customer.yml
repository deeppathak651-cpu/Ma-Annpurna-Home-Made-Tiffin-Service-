name: Build Kumaoni Potli Customer APK

on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/customer.yml'
      - 'Kumaoni-Potli-Customer-FIXED.html'
      - 'customer-icon.png'

jobs:
  build:
    name: Build Customer APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ============================================================
      # CREATE PACKAGE.JSON
      # ============================================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-customer",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/geolocation": "^7.1.0",
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF


      # ============================================================
      # INSTALL CAPACITOR + GEOLOCATION
      # ============================================================
      - name: Install Capacitor and Geolocation
        run: |
          npm install
          npm install @capacitor/assets --save-dev


      # ============================================================
      # CHECK CUSTOMER HTML
      # ============================================================
      - name: Check Customer HTML
        run: |
          FILE="./Kumaoni-Potli-Customer-FIXED.html"

          echo "============================================"
          echo "CHECKING CUSTOMER HTML"
          echo "============================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Customer HTML file not found:"
            echo "$FILE"
            echo ""
            echo "HTML files currently found:"
            find . -maxdepth 2 -type f -iname "*.html" -print
            exit 1
          fi

          echo "Customer HTML found:"
          ls -lh "$FILE"

          echo ""
          echo "Customer HTML checksum:"
          sha256sum "$FILE"


      # ============================================================
      # VERIFY FIRESTORE FOODS COLLECTION
      # ============================================================
      - name: Verify Customer Food Code
        run: |
          FILE="./Kumaoni-Potli-Customer-FIXED.html"

          echo "============================================"
          echo "VERIFYING CUSTOMER FOOD CODE"
          echo "============================================"

          if ! grep -q 'documents/kumaoniFoods' "$FILE"; then
            echo "ERROR: Customer HTML is NOT using Firestore collection:"
            echo "kumaoniFoods"
            exit 1
          fi

          echo "OK: Firestore collection 'kumaoniFoods' found."

          echo ""
          echo "Firestore endpoint:"
          grep -n "documents/kumaoniFoods" "$FILE" || true


      # ============================================================
      # PREPARE CUSTOMER HTML
      # ============================================================
      - name: Prepare Customer HTML
        run: |
          rm -rf www
          mkdir -p www

          cp "./Kumaoni-Potli-Customer-FIXED.html" "./www/index.html"

          echo "============================================"
          echo "CUSTOMER HTML COPIED TO APK"
          echo "============================================"

          ls -lh "./www/index.html"

          echo ""
          echo "Copied HTML checksum:"
          sha256sum "./www/index.html"


      # ============================================================
      # CREATE NATIVE LOCATION BRIDGE
      # ============================================================
      - name: Create Native Location Bridge
        run: |
          cat > native-location.js <<'EOF'
          import { Geolocation } from '@capacitor/geolocation';

          window.KumaoniNativeLocation = {

            async requestPermissions() {
              return await Geolocation.requestPermissions({
                permissions: ['location']
              });
            },

            async checkPermissions() {
              return await Geolocation.checkPermissions();
            },

            async getCurrentPosition(options = {}) {
              return await Geolocation.getCurrentPosition({
                enableHighAccuracy:
                  options.enableHighAccuracy !== false,
                timeout:
                  Number(options.timeout || 20000),
                maximumAge:
                  Number(options.maximumAge || 0)
              });
            }

          };
          EOF

          npx esbuild native-location.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=www/native-location.js

          echo "Native location bridge created:"
          ls -lh www/native-location.js


      # ============================================================
      # CONNECT HTML TO NATIVE LOCATION
      # ============================================================
      - name: Connect Customer HTML To Native Location
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("www/index.html")
          html = path.read_text(encoding="utf-8")

          bridge = r'''
          <script src="native-location.js"></script>

          <script>
          (function () {

            try {

              if (!window.KumaoniNativeLocation) {
                console.warn(
                  'Kumaoni Potli native location bridge unavailable.'
                );
                return;
              }

              const nativeLocation =
                window.KumaoniNativeLocation;

              if (!navigator.geolocation) {
                console.warn(
                  'Browser geolocation API unavailable.'
                );
                return;
              }

              navigator.geolocation.getCurrentPosition =
                function(success, error, options) {

                  const opts = options || {};

                  nativeLocation.requestPermissions()

                    .then(function(permission) {

                      console.log(
                        'Kumaoni Potli location permission:',
                        permission
                      );

                      if (
                        permission &&
                        permission.location &&
                        permission.location !== 'granted'
                      ) {
                        throw new Error(
                          'LOCATION_PERMISSION_DENIED'
                        );
                      }

                      return nativeLocation.getCurrentPosition({

                        enableHighAccuracy:
                          opts.enableHighAccuracy !== false,

                        timeout:
                          Number(
                            opts.timeout || 20000
                          ),

                        maximumAge:
                          Number(
                            opts.maximumAge || 0
                          )

                      });

                    })

                    .then(function(position) {

                      console.log(
                        'Kumaoni Potli location:',
                        position
                      );

                      if (
                        typeof success === 'function'
                      ) {

                        success({

                          coords: {

                            latitude:
                              position.coords.latitude,

                            longitude:
                              position.coords.longitude,

                            accuracy:
                              position.coords.accuracy,

                            altitude:
                              position.coords.altitude ??
                              null,

                            altitudeAccuracy:
                              position.coords.altitudeAccuracy ??
                              null,

                            heading:
                              position.coords.heading ??
                              null,

                            speed:
                              position.coords.speed ??
                              null

                          },

                          timestamp:
                            position.timestamp ||
                            Date.now()

                        });

                      }

                    })

                    .catch(function(err) {

                      console.error(
                        'Kumaoni Potli location error:',
                        err
                      );

                      if (
                        typeof error === 'function'
                      ) {

                        let code = 2;

                        const message =
                          String(
                            err?.message ||
                            err?.code ||
                            ''
                          ).toLowerCase();

                        if (
                          message.includes('permission') ||
                          message.includes('denied')
                        ) {
                          code = 1;
                        }

                        if (
                          message.includes('timeout')
                        ) {
                          code = 3;
                        }

                        error({

                          code: code,

                          message:
                            err?.message ||
                            'Unable to get current location.'

                        });

                      }

                    });

                };

              console.log(
                'Kumaoni Potli native Android location bridge active.'
              );

            }

            catch (e) {

              console.error(
                'Kumaoni Potli location bridge failed:',
                e
              );

            }

          })();
          </script>
          '''

          if "native-location.js" not in html:

              if "</body>" in html:

                  html = html.replace(
                      "</body>",
                      bridge + "\n</body>",
                      1
                  )

              else:

                  html += bridge

          path.write_text(
              html,
              encoding="utf-8"
          )
          PY

          echo "Native location bridge connected."

          echo ""
          echo "Checking location bridge:"
          grep -n "KumaoniNativeLocation" \
            www/index.html || true


      # ============================================================
      # CREATE CAPACITOR CONFIGURATION
      # ============================================================
      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kumaonipotli.customer",
            "appName": "Kumaoni Potli",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "hostname": "localhost",
              "androidScheme": "https"
            }
          }
          EOF

          cat capacitor.config.json


      # ============================================================
      # ADD ANDROID PLATFORM
      # ============================================================
      - name: Add Android platform
        run: |
          npx cap add android


      # ============================================================
      # PREPARE CUSTOMER ICON
      # ============================================================
      - name: Prepare Customer Icon
        run: |
          if [ ! -f "customer-icon.png" ]; then
            echo "ERROR: customer-icon.png not found."
            exit 1
          fi

          rm -rf resources
          mkdir -p resources

          cp customer-icon.png resources/icon.png

          echo "Customer icon ready:"
          ls -lh resources/icon.png


      # ============================================================
      # GENERATE ANDROID APP ICON
      # ============================================================
      - name: Generate Android App Icon
        run: |
          npx capacitor-assets generate --android


      # ============================================================
      # ADD ANDROID LOCATION PERMISSIONS
      # ============================================================
      - name: Add Android Location Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "============================================"
          echo "ADDING ANDROID LOCATION PERMISSIONS"
          echo "============================================"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          permissions = """
              <uses-permission
                  android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-feature
                  android:name="android.hardware.location.gps"
                  android:required="false" />
          """

          if (
              "android.permission.ACCESS_COARSE_LOCATION"
              not in text
          ):

              text = text.replace(
                  "</manifest>",
                  permissions +
                  "\n</manifest>",
                  1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          echo "Android location permissions added."

          echo ""
          grep -n -E \
            "ACCESS_COARSE_LOCATION|ACCESS_FINE_LOCATION|hardware.location.gps" \
            "$MANIFEST" || true


      # ============================================================
      # SYNC CAPACITOR
      # ============================================================
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # ============================================================
      # VERIFY ANDROID LOCATION PERMISSIONS
      # ============================================================
      - name: Verify Android Location Permissions
        run: |
          FILE="android/app/src/main/AndroidManifest.xml"

          echo "============================================"
          echo "VERIFYING LOCATION PERMISSIONS"
          echo "============================================"

          if ! grep -q \
            'android.permission.ACCESS_COARSE_LOCATION' \
            "$FILE"; then

            echo "ERROR: COARSE location permission missing."
            exit 1
          fi

          if ! grep -q \
            'android.permission.ACCESS_FINE_LOCATION' \
            "$FILE"; then

            echo "ERROR: FINE location permission missing."
            exit 1
          fi

          echo "OK: COARSE location permission found."
          echo "OK: FINE location permission found."


      # ============================================================
      # VERIFY PACKAGED CUSTOMER HTML
      # ============================================================
      - name: Verify packaged Customer HTML
        run: |
          FILE="android/app/src/main/assets/public/index.html"

          echo "============================================"
          echo "VERIFYING PACKAGED CUSTOMER HTML"
          echo "============================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Packaged index.html not found."
            exit 1
          fi

          echo "Packaged index.html:"
          ls -lh "$FILE"

          echo ""
          echo "Checking Firestore collection..."

          if ! grep -q \
            'documents/kumaoniFoods' \
            "$FILE"; then

            echo "ERROR: APK package does not contain:"
            echo "documents/kumaoniFoods"
            exit 1
          fi

          echo "OK: Firestore collection found."

          echo ""
          echo "Checking native location bridge..."

          if ! grep -q \
            'KumaoniNativeLocation' \
            "$FILE"; then

            echo "ERROR: Native location bridge missing."
            exit 1
          fi

          echo "OK: Native location bridge found."

          echo ""
          echo "Packaged HTML checksum:"
          sha256sum "$FILE"


      # ============================================================
      # BUILD CUSTOMER APK
      # ============================================================
      - name: Build Kumaoni Potli Customer APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace


      # ============================================================
      # RENAME APK
      # ============================================================
      - name: Rename Customer APK
        run: |
          mkdir -p release

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found:"
            echo "$APK"
            exit 1
          fi

          cp \
            "$APK" \
            "release/Kumaoni-Potli-Customer.apk"

          echo "============================================"
          echo "FINAL CUSTOMER APK"
          echo "============================================"

          ls -lh \
            "release/Kumaoni-Potli-Customer.apk"


      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload Kumaoni Potli Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Customer-APK
          path: release/Kumaoni-Potli-Customer.apk
          if-no-files-found: error
