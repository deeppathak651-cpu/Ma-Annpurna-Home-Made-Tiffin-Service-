name: Build Kumaoni Potli Customer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Customer HTML
        run: |
          CUSTOMER_FILE="Kumaoni-Potli-Customer-CONNECTED.html"

          if [ ! -f "$CUSTOMER_FILE" ]; then
            echo "ERROR: $CUSTOMER_FILE not found"
            ls -la
            exit 1
          fi

      - name: Create Capacitor Project
        run: |
          mkdir apk-build
          mkdir apk-build/www

          cp "Kumaoni-Potli-Customer-CONNECTED.html" apk-build/www/index.html

          cd apk-build

          npm init -y

          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

          npx cap init \
          "Kumaoni Potli Customer" \
          "com.kumaonipotli.customer" \
          --web-dir www

      - name: Add Android
        run: |
          cd apk-build
          npx cap add android

      - name: Copy Web Files
        run: |
          cd apk-build
          npx cap copy android
          npx cap sync android

      - name: Build APK
        run: |
          cd apk-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp apk-build/android/app/build/outputs/apk/debug/app-debug.apk \
          Kumaoni-Potli-Customer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Customer-APK
          path: Kumaoni-Potli-Customer.apk
