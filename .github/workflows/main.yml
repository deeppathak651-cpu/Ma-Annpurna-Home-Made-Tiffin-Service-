name: Build Kumaoni Potli Delivery APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - 'Kumaoni-Potli-Delivery-FIXED.html'
      - 'delivery-icon.png'
      - 'google-services.json'

  workflow_dispatch:

jobs:
  build:
    name: Build Delivery APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ============================================================
      # PACKAGE.JSON
      # ============================================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-delivery",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/assets": "^3.0.5"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF

      # ============================================================
      # INSTALL CAPACITOR
      # ============================================================
      - name: Install Capacitor
        run: |
          npm install

      # ============================================================
      # CHECK DELIVERY ICON
      # ============================================================
      - name: Check Delivery Icon
        run: |
          if [ ! -f "delivery-icon.png" ]; then
            echo "ERROR: delivery-icon.png not found"
            echo ""
            echo "Available PNG files:"
            find . -maxdepth 2 -type f -iname '*.png' -print
            exit 1
          fi

          echo "Delivery icon found:"
          ls -lh delivery-icon.png

      # ============================================================
      # PREPARE EXACT DELIVERY HTML
      # ============================================================
      - name: Prepare Delivery web files
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          # IMPORTANT:
          # Only this exact HTML file will be used for the APK.
          DELIVERY_HTML="Kumaoni-Potli-Delivery-FIXED.html"

          if [ ! -f "$DELIVERY_HTML" ]; then
            echo "=================================================="
            echo "ERROR: DELIVERY HTML FILE NOT FOUND"
            echo "$DELIVERY_HTML"
            echo "=================================================="
            echo ""
            echo "Delivery HTML files found in repository:"
            find . -maxdepth 3 -type f -iname '*delivery*.html' -print
            exit 1
          fi

          echo "=================================================="
          echo "EXACT DELIVERY HTML SELECTED"
          echo "=================================================="
          echo "$DELIVERY_HTML"
          echo "=================================================="

          cp -- "$DELIVERY_HTML" www/index.html

          echo ""
          echo "Copied Delivery HTML:"
          ls -lh www/index.html

          echo ""
          echo "Checking important login code..."

          if grep -q "window.loginUser" www/index.html; then
            echo "OK: loginUser found."
          else
            echo "ERROR: loginUser not found."
            exit 1
          fi

          if grep -q "Signing In" www/index.html; then
            echo "OK: Signing In code found."
          else
            echo "ERROR: Signing In code not found."
            exit 1
          fi

      # ============================================================
      # CAPACITOR CONFIGURATION
      # ============================================================
      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.annapurna.delivery",
            "appName": "Kumaoni Potli Delivery",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          echo "Capacitor configuration:"
          cat capacitor.config.json

      # ============================================================
      # ANDROID PLATFORM
      # ============================================================
      - name: Add Android platform
        run: |
          npx cap add android

      # ============================================================
      # DELIVERY APP ICON
      # ============================================================
      - name: Set Delivery App Icon
        run: |
          rm -rf resources
          mkdir -p resources

          cp delivery-icon.png resources/icon.png

          echo "Delivery icon copied:"
          ls -lh resources/icon.png

      # ============================================================
      # GENERATE APP ICON
      # ============================================================
      - name: Generate Delivery App Icon
        run: |
          npx capacitor-assets generate --android

      # ============================================================
      # FIREBASE CONFIGURATION
      # ============================================================
      - name: Copy Firebase configuration
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json

            echo "Firebase configuration copied successfully."
            echo ""
            echo "Firebase file:"
            ls -lh android/app/google-services.json
          else
            echo "ERROR: google-services.json not found"
            echo ""
            echo "Available Firebase files:"
            find . -maxdepth 3 -type f -name 'google-services*.json' -print
            exit 1
          fi

      # ============================================================
      # VERIFY FIREBASE PACKAGE
      # ============================================================
      - name: Verify Delivery Firebase package
        run: |
          echo "Checking Firebase package..."

          if grep -q '"package_name": "com.annapurna.delivery"' google-services.json; then
            echo "Delivery Firebase package verified successfully."
          else
            echo "ERROR: com.annapurna.delivery is not registered in google-services.json"
            echo ""
            echo "Firebase package names found:"
            grep -o '"package_name"[^,]*' google-services.json || true
            exit 1
          fi

      # ============================================================
      # ANDROID INTERNET + LOCATION PERMISSIONS
      # ============================================================
      - name: Add Android permissions
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          text = manifest.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          ]

          additions = []

          for permission in permissions:
              if permission not in text:
                  additions.append(permission)

          if additions:
              marker = "<manifest"
              position = text.find(marker)

              if position == -1:
                  raise SystemExit("ERROR: <manifest> tag not found")

              end = text.find(">", position)

              if end == -1:
                  raise SystemExit("ERROR: Opening <manifest> tag is invalid")

              insert = "\n" + "\n".join(additions)

              text = text[:end + 1] + insert + text[end + 1:]

              manifest.write_text(text)

          print("Android Internet/network/location permissions configured successfully.")
          PY

          echo ""
          echo "Checking Android permissions:"
          grep -E "INTERNET|ACCESS_NETWORK_STATE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION" \
            android/app/src/main/AndroidManifest.xml || true

      # ============================================================
      # KOTLIN DUPLICATE CLASS FIX
      # ============================================================
      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
              }
          }
          EOF

          echo "Kotlin resolution strategy configured."

      # ============================================================
      # CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      # ============================================================
      # BUILD DELIVERY APK
      # ============================================================
      - name: Build Delivery APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        run: |
          echo "=================================================="
          echo "CHECKING GENERATED APK"
          echo "=================================================="

          ls -lh android/app/build/outputs/apk/debug/

          test -f android/app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "APK generated successfully:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      # ============================================================
      # UPLOAD DELIVERY APK
      # ============================================================
      - name: Upload Delivery APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Delivery-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
