name: Build Kumaoni Potli Customer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-customer",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare customer web files
        run: |
          set -e

          rm -rf www
          mkdir -p www

          echo "Searching for Customer HTML..."

          FILE=""

          if [ -f "Kumaoni-Potli-Customer-App.html" ]; then
            FILE="Kumaoni-Potli-Customer-App.html"
          elif [ -f "Kumaoni-Potli-Customer-App-2.html" ]; then
            FILE="Kumaoni-Potli-Customer-App-2.html"
          else
            FILE=$(find . -type f \
              \( -iname "*Kumaoni*Potli*Customer*.html" -o -iname "*Customer*.html" \) \
              ! -path "./node_modules/*" \
              ! -path "./www/*" \
              ! -name "index.html" \
              ! -name "index.html*" \
              | sort | head -n 1)
          fi

          if [ -z "$FILE" ]; then
            echo "ERROR: Customer HTML file not found."
            echo "Available HTML files:"
            find . -type f -name "*.html" \
              ! -path "./node_modules/*" \
              ! -name "index.html*" \
              | sort
            exit 1
          fi

          echo "Using Customer HTML: $FILE"

          cp "$FILE" www/index.html

          echo "Customer web file created:"
          ls -lh www/index.html

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kumaonipotli.customer",
            "appName": "Kumaoni Potli Customer",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Copy Firebase configuration
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "Firebase configuration copied."
          else
            echo "google-services.json not found."
            echo "Continuing because Firebase may already be configured inside the HTML."
          fi

      - name: Add Android location permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          fi

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle <<'EOF'

          // Kumaoni Potli Kotlin compatibility fix
          allprojects {
              configurations.configureEach {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify Android project
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Customer APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
