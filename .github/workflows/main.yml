      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Add Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text()

          manifest_start = text.find("<manifest")
          if manifest_start == -1:
              raise SystemExit("Opening <manifest> tag not found")

          manifest_end = text.find(">", manifest_start)
          if manifest_end == -1:
              raise SystemExit("Closing > of <manifest> not found")

          insert_at = manifest_end + 1

          permissions = """
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
"""

          if "android.permission.ACCESS_COARSE_LOCATION" not in text:
              text = text[:insert_at] + permissions + text[insert_at:]

          manifest.write_text(text)

          print("Location permissions added successfully.")
          print(manifest.read_text())
          PY

      - name: Verify Android location permissions
        run: |
          echo "Checking AndroidManifest.xml..."
          grep -n "ACCESS_.*LOCATION" android/app/src/main/AndroidManifest.xml || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
