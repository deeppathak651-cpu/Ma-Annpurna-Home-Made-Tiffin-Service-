name: Build Kumaoni Potli Delivery APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - '*delivery*.html'
      - 'delivery-icon.png'
      - 'google-services.json'

  workflow_dispatch:

jobs:
  build:
    name: Build Delivery APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ============================================================
      # PACKAGE.JSON
      # ============================================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-delivery",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/assets": "^3.0.5"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF

      # ============================================================
      # INSTALL CAPACITOR
      # ============================================================
      - name: Install Capacitor
        run: |
          npm install

      # ============================================================
      # CHECK DELIVERY ICON
      # ============================================================
      - name: Check Delivery Icon
        run: |
          if [ ! -f "delivery-icon.png" ]; then
            echo "ERROR: delivery-icon.png not found in repository root"
            echo ""
            echo "Available PNG files:"
            find . -maxdepth 2 -type f -iname '*.png' -print
            exit 1
          fi

          echo "Delivery icon found:"
          ls -lh delivery-icon.png

      # ============================================================
      # PREPARE DELIVERY HTML
      # ============================================================
      - name: Prepare Delivery web files
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          echo "Searching Git tracked files for Delivery HTML..."

          DELIVERY_HTML=$(git ls-files | grep -iE '(^|/)[^/]*delivery[^/]*\.html$' | head -n 1 || true)

          if [ -z "$DELIVERY_HTML" ]; then
            echo "ERROR: Delivery HTML file not found in Git tracked files"
            echo ""
            echo "Git tracked HTML files:"
            git ls-files | grep -i '\.html$' || true
            exit 1
          fi

          echo "Delivery HTML found:"
          printf '%s\n' "$DELIVERY_HTML"

          cp -- "$DELIVERY_HTML" www/index.html

          echo ""
          echo "Delivery web file prepared successfully:"
          ls -lh www/index.html

      # ============================================================
      # CAPACITOR CONFIGURATION
      # ============================================================
      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.annapurna.delivery",
            "appName": "Kumaoni Potli Delivery",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          echo "Capacitor configuration created:"
          cat capacitor.config.json

      # ============================================================
      # ADD ANDROID PLATFORM
      # ============================================================
      - name: Add Android platform
        run: |
          npx cap add android

      # ============================================================
      # DELIVERY APP ICON
      # ============================================================
      - name: Set Delivery App Icon
        run: |
          rm -rf resources
          mkdir -p resources

          cp delivery-icon.png resources/icon.png

          echo "Delivery icon copied:"
          ls -lh resources/icon.png

      # ============================================================
      # GENERATE DELIVERY APP ICON
      # ============================================================
      - name: Generate Delivery App Icon
        run: |
          npx capacitor-assets generate --android

      # ============================================================
      # FIREBASE CONFIGURATION
      # ============================================================
      - name: Copy Firebase configuration
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "Firebase configuration copied successfully."
          else
            echo "ERROR: google-services.json not found"
            echo ""
            echo "Available Firebase files:"
            find . -maxdepth 2 -type f -name 'google-services*.json' -print
            exit 1
          fi

      # ============================================================
      # VERIFY FIREBASE PACKAGE
      # ============================================================
      - name: Verify Delivery Firebase package
        run: |
          echo "Checking Firebase package..."

          if grep -q '"package_name": "com.annapurna.delivery"' google-services.json; then
            echo "Delivery Firebase package verified successfully."
          else
            echo "ERROR: com.annapurna.delivery is not registered in google-services.json"
            echo ""
            echo "Firebase package names found:"
            grep -o '"package_name"[^,]*' google-services.json || true
            exit 1
          fi

      # ============================================================
      # LOCATION PERMISSIONS
      # ============================================================
      - name: Add Android location
