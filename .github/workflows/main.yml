name: Build Kumaoni Potli Customer APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-customer",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            }
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install

      - name: Prepare customer web files
        run: |
          rm -rf www
          mkdir -p www

          FILE=$(find . -maxdepth 1 -type f -name 'Kumaoni-Potli-Customer*.html' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Customer HTML file not found"
            ls -la
            exit 1
          fi

          echo "Using customer app: $FILE"
          cp "$FILE" www/index.html

          echo "Customer web files:"
          ls -lh www

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.annapurna.tiffin",
            "appName": "Kumaoni Potli Customer",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Copy Firebase configuration
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
          else
            echo "ERROR: google-services.json not found"
            exit 1
          fi

      - name: Verify Firebase package
        run: |
          echo "Checking Firebase package..."
          grep -n '"package_name"' google-services.json || true

          if ! grep -q '"package_name": "com.annapurna.tiffin"' google-services.json; then
            echo "ERROR: google-services.json does not contain com.annapurna.tiffin"
            exit 1
          fi

      - name: Add Android location permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' "$MANIFEST"
          fi

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
              }
          }
          EOF

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify Android project
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Customer APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
