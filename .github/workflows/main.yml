name: Build Kumaoni Potli Restaurant APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kumaoni-potli-restaurant",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            }
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install

      - name: Prepare Restaurant web files
        run: |
          rm -rf www
          mkdir -p www

          FILE="Kumaoni-Potli-RESTAURANT-PANEL-EXACT-MIDDLE.html"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Restaurant HTML file not found"
            echo "Available HTML files:"
            find . -maxdepth 1 -type f -name "*.html" -print
            exit 1
          fi

          echo "Using Restaurant app: $FILE"
          cp "$FILE" www/index.html

          echo "Restaurant web files:"
          ls -lh www

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.annapurna.restaurant",
            "appName": "Kumaoni Potli Restaurant",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Copy Firebase configuration
        run: |
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
          else
            echo "ERROR: google-services.json not found"
            exit 1
          fi

      - name: Verify Firebase configuration
        run: |
          echo "Firebase Android packages found:"
          grep -n '"package_name"' google-services.json || true

          if ! grep -q '"package_name": "com.annapurna.restaurant"' google-services.json; then
            echo "ERROR: com.annapurna.restaurant is not registered in google-services.json"
            exit 1
          fi

          echo "Restaurant Firebase package verified successfully."

      - name: Add Android location permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' "$MANIFEST"
          fi

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
              }
          }
          EOF

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify Android project
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Restaurant APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Restaurant APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Restaurant-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
