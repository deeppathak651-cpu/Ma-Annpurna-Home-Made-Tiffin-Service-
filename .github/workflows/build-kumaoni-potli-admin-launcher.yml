name: Build Kumaoni Potli Admin APK 13 - Panel Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Capacitor Admin project
        shell: bash
        run: |
          set -e
          mkdir -p cap-admin
          cd cap-admin
          npm init -y
          npm install @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/cli@7.4.3
          mkdir -p www
          cp ../input/admin-panel.html www/index.html
          npx cap init "Kumaoni Potli Admin" com.annapurna.admin --web-dir=www
          npx cap add android

      - name: Add native PanelLauncher plugin
        shell: bash
        run: |
          set -e
          cd cap-admin
          mkdir -p android/app/src/main/java/com/annapurna/admin

          cat > android/app/src/main/java/com/annapurna/admin/PanelLauncherPlugin.java <<'JAVA'
          package com.annapurna.admin;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;

          import android.content.Intent;

          @CapacitorPlugin(name = "PanelLauncher")
          public class PanelLauncherPlugin extends Plugin {
              @PluginMethod
              public void launch(PluginCall call) {
                  String packageName = call.getString("packageName", "");
                  if (packageName == null || packageName.trim().isEmpty()) {
                      call.reject("Missing packageName");
                      return;
                  }

                  try {
                      Intent intent = getContext().getPackageManager()
                              .getLaunchIntentForPackage(packageName.trim());

                      if (intent == null) {
                          JSObject result = new JSObject();
                          result.put("launched", false);
                          call.resolve(result);
                          return;
                      }

                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);

                      JSObject result = new JSObject();
                      result.put("launched", true);
                      call.resolve(result);
                  } catch (Exception e) {
                      call.reject("Could not launch panel app", e);
                  }
              }
          }
          JAVA

          cat > android/app/src/main/java/com/annapurna/admin/MainActivity.java <<'JAVA'
          package com.annapurna.admin;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PanelLauncherPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Add Android package visibility for the 3 panel APKs
        shell: bash
        run: |
          set -e
          cd cap-admin
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if '<queries>' not in s:
              insert='''\n    <queries>
        <package android:name="com.annapurna.customer" />
        <package android:name="com.annapurna.restaurant" />
        <package android:name="com.annapurna.delivery" />
    </queries>
          '''
              s=s.replace('</manifest>', insert+'</manifest>')
              p.write_text(s)
          PY

      - name: Sync Capacitor
        shell: bash
        run: |
          cd cap-admin
          npx cap sync android

      - name: Build Admin APK
        shell: bash
        run: |
          cd cap-admin/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify package name
        shell: bash
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging cap-admin/android/app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.annapurna.admin'"

      - name: Upload Admin APK 13
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK-13
          path: cap-admin/android/app/build/outputs/apk/debug/app-debug.apk
