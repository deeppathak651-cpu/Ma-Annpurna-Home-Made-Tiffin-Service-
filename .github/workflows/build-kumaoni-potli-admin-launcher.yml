name: Build Kumaoni Potli Admin APK - Current Admin Panel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # ============================================================
      # ALWAYS USE CURRENT ADMIN HTML
      # ============================================================
      - name: Select current Admin HTML
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SELECTING CURRENT ADMIN PANEL"
          echo "======================================"

          if [ ! -f "admin-panel.html" ]; then
            echo "ERROR: admin-panel.html was not found."
            echo ""
            echo "Repository root files:"
            ls -lah
            exit 1
          fi

          SOURCE_HTML="admin-panel.html"

          echo "Using Admin HTML:"
          echo "$SOURCE_HTML"

          echo "ADMIN_SOURCE_HTML=$SOURCE_HTML" >> "$GITHUB_ENV"

          ls -lh "$SOURCE_HTML"

      # ============================================================
      # VERIFY CURRENT ADMIN PANEL
      # ============================================================
      - name: Verify current Admin Panel
        shell: bash
        run: |
          set -e

          FILE="$ADMIN_SOURCE_HTML"

          echo "======================================"
          echo "VERIFYING CURRENT ADMIN PANEL"
          echo "======================================"

          if ! grep -q "ADMIN CONTROL CENTER" "$FILE"; then
            echo "ERROR: ADMIN CONTROL CENTER not found."
            exit 1
          fi

          if ! grep -q "Customer Panel" "$FILE"; then
            echo "ERROR: Customer Panel not found."
            exit 1
          fi

          if ! grep -q "Restaurant Panel" "$FILE"; then
            echo "ERROR: Restaurant Panel not found."
            exit 1
          fi

          if ! grep -q "Delivery Panel" "$FILE"; then
            echo "ERROR: Delivery Panel not found."
            exit 1
          fi

          echo ""
          echo "CURRENT ADMIN PANEL VERIFIED."
          echo "======================================"

      # ============================================================
      # CREATE CAPACITOR PROJECT
      # ============================================================
      - name: Create Capacitor Admin project
        shell: bash
        run: |
          set -e

          rm -rf cap-admin

          mkdir -p cap-admin/www

          echo "Copying current Admin HTML..."

          cp "$ADMIN_SOURCE_HTML" \
             "cap-admin/www/index.html"

          echo ""
          echo "Admin HTML copied to:"
          echo "cap-admin/www/index.html"

          ls -lh \
            "cap-admin/www/index.html"

          cd cap-admin

          npm init -y

          npm install \
            @capacitor/core@7.4.3 \
            @capacitor/android@7.4.3 \
            @capacitor/cli@7.4.3

          npx cap init \
            "Kumaoni Potli Admin" \
            "com.annapurna.admin" \
            --web-dir=www

          npx cap add android

      # ============================================================
      # ADD ADMIN ICON
      # ============================================================
      - name: Add Admin Launcher Icon
        shell: bash
        run: |
          set -e

          if [ ! -f "admin-icon.png" ]; then
            echo "ERROR: admin-icon.png not found."
            ls -lah
            exit 1
          fi

          cd cap-admin

          mkdir -p \
            android/app/src/main/res/drawable

          cp "../admin-icon.png" \
            "android/app/src/main/res/drawable/admin_icon.png"

          echo "Admin icon copied successfully."

          ls -lh \
            "android/app/src/main/res/drawable/admin_icon.png"

      # ============================================================
      # NATIVE PANEL LAUNCHER
      # ============================================================
      - name: Add native PanelLauncher plugin
        shell: bash
        run: |
          set -e

          cd cap-admin

          mkdir -p \
            android/app/src/main/java/com/annapurna/admin

          cat > android/app/src/main/java/com/annapurna/admin/PanelLauncherPlugin.java <<'JAVA'
          package com.annapurna.admin;

          import android.content.Intent;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;

          @CapacitorPlugin(name = "PanelLauncher")
          public class PanelLauncherPlugin extends Plugin {

              @PluginMethod
              public void launch(PluginCall call) {

                  String packageName =
                      call.getString("packageName", "");

                  if (packageName == null ||
                      packageName.trim().isEmpty()) {

                      call.reject("Missing packageName");
                      return;
                  }

                  try {

                      Intent intent =
                          getContext()
                              .getPackageManager()
                              .getLaunchIntentForPackage(
                                  packageName.trim()
                              );

                      if (intent == null) {

                          JSObject result =
                              new JSObject();

                          result.put(
                              "launched",
                              false
                          );

                          result.put(
                              "packageName",
                              packageName
                          );

                          result.put(
                              "message",
                              "Panel app is not installed"
                          );

                          call.resolve(result);
                          return;
                      }

                      intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      getContext().startActivity(intent);

                      JSObject result =
                          new JSObject();

                      result.put(
                          "launched",
                          true
                      );

                      result.put(
                          "packageName",
                          packageName
                      );

                      call.resolve(result);

                  } catch (Exception e) {

                      call.reject(
                          "Could not launch panel app",
                          e
                      );
                  }
              }
          }
          JAVA

          cat > android/app/src/main/java/com/annapurna/admin/MainActivity.java <<'JAVA'
          package com.annapurna.admin;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(
                  Bundle savedInstanceState
              ) {

                  registerPlugin(
                      PanelLauncherPlugin.class
                  );

                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      # ============================================================
      # ANDROID PACKAGE VISIBILITY
      # ============================================================
      - name: Add Android package visibility
        shell: bash
        run: |
          set -e

          cd cap-admin

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text()

          queries = """
              <queries>
                  <package android:name="com.annapurna.customer" />
                  <package android:name="com.annapurna.restaurant" />
                  <package android:name="com.annapurna.delivery" />
              </queries>
          """

          if "<queries>" not in s:
              s = s.replace(
                  "</manifest>",
                  queries + "\n</manifest>"
              )

          p.write_text(s)
          PY

      # ============================================================
      # APP NAME
      # ============================================================
      - name: Set Admin App Name
        shell: bash
        run: |
          set -e

          cd cap-admin

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          p.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          p.write_text(
          """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Kumaoni Potli Admin</string>
              <string name="title_activity_main">Kumaoni Potli Admin</string>
              <string name="package_name">com.annapurna.admin</string>
              <string name="custom_url_scheme">com.annapurna.admin</string>
          </resources>
          """
          )
          PY

      # ============================================================
      # CONFIGURE LAUNCHER ICON
      # ============================================================
      - name: Configure Android Launcher Icon
        shell: bash
        run: |
          set -e

          cd cap-admin

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text()

          s = s.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/admin_icon"'
          )

          s = s.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@drawable/admin_icon"'
          )

          p.write_text(s)
          PY

          echo "Launcher icon configured."

      # ============================================================
      # VERIFY MANIFEST
      # ============================================================
      - name: Verify AndroidManifest.xml
        shell: bash
        run: |
          set -e

          cd cap-admin

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse(
              "android/app/src/main/AndroidManifest.xml"
          )

          print(
              "AndroidManifest.xml is valid XML."
          )
          PY

      # ============================================================
      # VERIFY ADMIN ICON
      # ============================================================
      - name: Verify Admin Icon
        shell: bash
        run: |
          set -e

          cd cap-admin

          if [ ! -f \
            "android/app/src/main/res/drawable/admin_icon.png"
          ]; then

            echo "ERROR: Admin icon is missing."

            exit 1

          fi

          file \
            "android/app/src/main/res/drawable/admin_icon.png"

          ls -lh \
            "android/app/src/main/res/drawable/admin_icon.png"

      # ============================================================
      # VERIFY FINAL WEB FILE
      # ============================================================
      - name: Verify final Admin web file
        shell: bash
        run: |
          set -e

          cd cap-admin

          echo "======================================"
          echo "FINAL ADMIN WEB FILE"
          echo "======================================"

          ls -lh www/index.html

          if ! grep -q "ADMIN CONTROL CENTER" \
              www/index.html; then

            echo "ERROR: Admin Control Center missing."

            exit 1

          fi

          if ! grep -q "Customer Panel" \
              www/index.html; then

            echo "ERROR: Customer Panel missing."

            exit 1

          fi

          if ! grep -q "Restaurant Panel" \
              www/index.html; then

            echo "ERROR: Restaurant Panel missing."

            exit 1

          fi

          if ! grep -q "Delivery Panel" \
              www/index.html; then

            echo "ERROR: Delivery Panel missing."

            exit 1

          fi

          echo ""
          echo "FINAL ADMIN HTML VERIFIED."
          echo "======================================"

      # ============================================================
      # SYNC CAPACITOR
      # ============================================================
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          cd cap-admin

          npx cap sync android

      # ============================================================
      # BUILD APK
      # ============================================================
      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          cd cap-admin/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ============================================================
      # RENAME APK
      # ============================================================
      - name: Rename Admin APK
        shell: bash
        run: |
          set -e

          cd cap-admin/android

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          FINAL_APK="app/build/outputs/apk/debug/Kumaoni-Potli-Admin.apk"

          if [ ! -f "$SOURCE_APK" ]; then

            echo "ERROR: APK was not generated."

            exit 1

          fi

          cp "$SOURCE_APK" "$FINAL_APK"

          echo "======================================"
          echo "Kumaoni Potli Admin APK CREATED"
          echo "======================================"

          ls -lh "$FINAL_APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: cap-admin/android/app/build/outputs/apk/debug/Kumaoni-Potli-Admin.apk
          if-no-files-found: error
