name: Build Kumaoni Potli Admin APK 13 - Panel Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Create Capacitor Admin project
        shell: bash
        run: |
          set -e

          mkdir -p cap-admin/www

          if [ ! -f "admin-panel.html" ]; then
            echo "ERROR: admin-panel.html not found in repository root."
            ls -la
            exit 1
          fi

          if [ ! -f "admin-icon.png" ]; then
            echo "ERROR: admin-icon.png not found in repository root."
            ls -la
            exit 1
          fi

          cp "admin-panel.html" "cap-admin/www/index.html"

          cd cap-admin

          npm init -y

          npm install @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/cli@7.4.3

          npx cap init "Kumaoni Potli Admin" "com.annapurna.admin" --web-dir=www

          npx cap add android

      - name: Add Admin Launcher Icon
        shell: bash
        run: |
          set -e

          cd cap-admin

          mkdir -p android/app/src/main/res/drawable

          cp "../admin-icon.png" \
             "android/app/src/main/res/drawable/admin_icon.png"

          echo "Admin launcher icon copied successfully."

          ls -lh \
            "android/app/src/main/res/drawable/admin_icon.png"

      - name: Add native PanelLauncher plugin
        shell: bash
        run: |
          set -e

          cd cap-admin

          mkdir -p android/app/src/main/java/com/annapurna/admin

          cat > android/app/src/main/java/com/annapurna/admin/PanelLauncherPlugin.java <<'JAVA'
          package com.annapurna.admin;

          import android.content.Intent;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;

          @CapacitorPlugin(name = "PanelLauncher")
          public class PanelLauncherPlugin extends Plugin {

              @PluginMethod
              public void launch(PluginCall call) {

                  String packageName =
                      call.getString("packageName", "");

                  if (packageName == null ||
                      packageName.trim().isEmpty()) {

                      call.reject("Missing packageName");
                      return;
                  }

                  try {

                      Intent intent =
                          getContext()
                          .getPackageManager()
                          .getLaunchIntentForPackage(
                              packageName.trim()
                          );

                      if (intent == null) {

                          JSObject result = new JSObject();

                          result.put("launched", false);
                          result.put("packageName", packageName);
                          result.put(
                              "message",
                              "Panel app is not installed"
                          );

                          call.resolve(result);
                          return;
                      }

                      intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      getContext().startActivity(intent);

                      JSObject result = new JSObject();

                      result.put("launched", true);
                      result.put("packageName", packageName);

                      call.resolve(result);

                  } catch (Exception e) {

                      call.reject(
                          "Could not launch panel app",
                          e
                      );
                  }
              }
          }
          JAVA

          cat > android/app/src/main/java/com/annapurna/admin/MainActivity.java <<'JAVA'
          package com.annapurna.admin;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  registerPlugin(PanelLauncherPlugin.class);

                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Add Android package visibility
        shell: bash
        run: |
          set -e

          cd cap-admin

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          queries = """
              <queries>
                  <package android:name="com.annapurna.customer" />
                  <package android:name="com.annapurna.restaurant" />
                  <package android:name="com.annapurna.delivery" />
              </queries>
          """

          if "<queries>" not in s:
              s = s.replace(
                  "</manifest>",
                  queries + "\n</manifest>"
              )

          p.write_text(s)
          PY

      - name: Set Admin App Name
        shell: bash
        run: |
          set -e

          cd cap-admin

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          p.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          p.write_text(
          """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Kumaoni Potli Admin</string>
              <string name="title_activity_main">Kumaoni Potli Admin</string>
              <string name="package_name">com.annapurna.admin</string>
              <string name="custom_url_scheme">com.annapurna.admin</string>
          </resources>
          """
          )
          PY

      - name: Configure Android Launcher Icon
        shell: bash
        run: |
          set -e

          cd cap-admin

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text()

          if 'android:icon="@mipmap/ic_launcher"' in s:
              s = s.replace(
                  'android:icon="@mipmap/ic_launcher"',
                  'android:icon="@drawable/admin_icon"'
              )

          if 'android:roundIcon="@mipmap/ic_launcher_round"' in s:
              s = s.replace(
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  'android:roundIcon="@drawable/admin_icon"'
              )

          p.write_text(s)
          PY

          echo "Launcher icon configured:"
          grep -o \
            'android:icon="[^"]*"' \
            android/app/src/main/AndroidManifest.xml || true

          grep -o \
            'android:roundIcon="[^"]*"' \
            android/app/src/main/AndroidManifest.xml || true

      - name: Verify AndroidManifest.xml
        shell: bash
        run: |
          set -e

          cd cap-admin

          echo "Checking AndroidManifest.xml..."

          cat android/app/src/main/AndroidManifest.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse(
              "android/app/src/main/AndroidManifest.xml"
          )

          print(
              "AndroidManifest.xml is valid XML."
          )
          PY

      - name: Verify Admin Icon
        shell: bash
        run: |
          set -e

          cd cap-admin

          if [ ! -f \
            "android/app/src/main/res/drawable/admin_icon.png"
          ]; then
            echo "ERROR: Admin icon is missing."
            exit 1
          fi

          file \
            "android/app/src/main/res/drawable/admin_icon.png"

          ls -lh \
            "android/app/src/main/res/drawable/admin_icon.png"

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          cd cap-admin

          npx cap sync android

      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          cd cap-admin/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Rename Admin APK
        shell: bash
        run: |
          set -e

          cd cap-admin/android

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          FINAL_APK="app/build/outputs/apk/debug/Kumaoni-Potli-Admin.apk"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$SOURCE_APK" "$FINAL_APK"

          echo "======================================"
          echo "Kumaoni Potli Admin APK created"
          echo "======================================"

          ls -lh "$FINAL_APK"

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kumaoni-Potli-Admin-APK
          path: cap-admin/android/app/build/outputs/apk/debug/Kumaoni-Potli-Admin.apk
          if-no-files-found: error
