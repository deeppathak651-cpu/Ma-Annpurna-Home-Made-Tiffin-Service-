<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#004d35">
<title>Kumaoni Potli - Create Account</title>
<style>
:root{--g:#004d35;--gold:#f6c84c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#00271d;color:#fff}
body{display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;overflow:hidden;background:linear-gradient(180deg,#004d35,#003d2d 70%,#003325)}
.header{text-align:center;padding:10px 18px 5px}
.logo{display:block;width:min(42%,180px);margin:0 auto 5px;border-radius:18px;filter:drop-shadow(0 7px 12px rgba(0,0,0,.22))}
h1{font-size:29px;line-height:1.05;margin:3px 0;font-weight:800}
.subtitle{font-size:13px;color:#f2f5f3;margin-bottom:9px}
.form{padding:0 14px 18px}
.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,224,130,.28);border-radius:20px;padding:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field{margin-bottom:9px}
label{display:block;font-size:12px;font-weight:700;margin:0 0 5px;color:#f8e7a2}
input,select{width:100%;height:45px;border:2px solid var(--gold);border-radius:12px;background:#fafafa;color:#173d31;font-size:14px;padding:0 10px;outline:none}
input::placeholder{color:#8a8a8a}
.location{display:grid;grid-template-columns:1fr auto;gap:7px}
.location button{height:45px;border:0;border-radius:12px;background:var(--gold);color:#083d2d;font-weight:800;padding:0 10px}
.location-status{font-size:11px;color:#d9e5df;margin-top:5px;min-height:14px}
.photo{border:1px dashed var(--gold);border-radius:12px;padding:8px;background:rgba(255,255,255,.04)}
.photo input{height:auto;border:0;background:transparent;color:#fff;padding:0}
.terms{display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.35;margin:8px 2px 12px;color:#edf2ef}
.terms input{width:17px;height:17px;margin:0;accent-color:#f6c84c;flex:none}
.btn{width:100%;height:49px;border:0;border-radius:28px;background:linear-gradient(90deg,#f3c343,#ffe07b,#f3c343);color:#063c2d;font-size:17px;font-weight:800}
.back{display:block;text-align:center;color:#ffe18a;font-size:13px;font-weight:700;margin-top:10px;cursor:pointer}
.note{font-size:10px;color:#b9c9c2;text-align:center;margin-top:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#062f23;color:#fff;border:1px solid #f6c84c;border-radius:12px;padding:10px 14px;font-size:12px;display:none;z-index:10;max-width:90%;text-align:center}
@media(max-width:380px){
.header{padding-top:7px}.logo{width:39%;max-width:155px}h1{font-size:27px}
.form{padding:0 10px 14px}.card{padding:10px}input,select,.location button{height:42px;font-size:13px}
}
</style>
</head>

<h1>Create Account</h1>
<div class="subtitle">Join as a Kumaoni Potli Delivery Partner</div>
</section>

<main class="form"><div class="card">
<div class="row">
<div class="field"><label>Full Name *</label><input id="name" placeholder="Full Name" autocomplete="name"></div>
<div class="field"><label>Mobile Number *</label><input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit number"></div>
</div>
<div class="row">
<div class="field"><label>Email Address *</label><input id="email" type="email" placeholder="Email Address"></div>
<div class="field"><label>Vehicle Type *</label><select id="vehicle"><option value="">Select</option><option>Bike</option><option>Scooter</option><option>Cycle</option><option>Other</option></select></div>
</div>
<div class="row">
<div class="field"><label>Password *</label><input id="password" type="password" placeholder="Create password"></div>
<div class="field"><label>Confirm Password *</label><input id="confirm" type="password" placeholder="Confirm password"></div>
</div>
<div class="row">
<div class="field"><label>Vehicle Number *</label><input id="vnumber" placeholder="e.g. UK01AB1234"></div>
<div class="field"><label>Pincode *</label><input id="pincode" inputmode="numeric" maxlength="6" placeholder="6-digit pincode"></div>
</div>
<div class="field"><label>Complete Address *</label><input id="address" placeholder="House / Street / Area"></div>
<div class="row">
<div class="field"><label>City / Area *</label><input id="city" placeholder="City / Area"></div>
<div class="field"><label>State</label><input id="state" placeholder="State"></div>
</div>
<div class="field">
<label>Current Location *</label>
<div class="location"><input id="location" readonly placeholder="Location not selected"><button type="button" onclick="getLocation()">Use Current</button></div>
<div class="location-status" id="locStatus">GPS location will be saved with your partner profile.</div>
</div>
<div class="field"><label>Profile Photo (Optional)</label><div class="photo"><input id="photo" type="file" accept="image/*"></div></div>
<label class="terms"><input id="terms" type="checkbox"><span>I agree to the Delivery Partner Terms &amp; Conditions and understand that my account requires Admin approval.</span></label>
<button class="btn" onclick="createAccount()">Create Account</button>
<a class="back" onclick="goBack()">← Back to Sign In</a>
<div class="note">After registration: Account will remain <b>Pending Approval</b> until Admin approves it.</div>
</div></main>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBAro8dYjdUo8B7YRCUPX9WpI7_btf0CAI",authDomain:"ma-annpurna-tiffin.firebaseapp.com",projectId:"ma-annpurna-tiffin",storageBucket:"ma-annpurna-tiffin.firebasestorage.app",messagingSenderId:"732257430751",appId:"1:732257430751:web:59758d59bdc94e348a0d6a",measurementId:"G-9NVW0R94RG"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
</script>
<script>
let coords=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
function getLocation(){
 const input=document.getElementById('location'),status=document.getElementById('locStatus');
 if(!navigator.geolocation){status.textContent='GPS is not supported on this device/browser.';return;}
 input.value='Getting location...';status.textContent='Please allow location permission...';
 navigator.geolocation.getCurrentPosition(
  p=>{coords={lat:p.coords.latitude,lng:p.coords.longitude};input.value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);status.textContent='✓ Current location captured';},
  ()=>{input.value='';status.textContent='Location permission was not allowed. Try again.';},
  {enableHighAccuracy:true,timeout:12000,maximumAge:0}
 );
}
function val(id){return document.getElementById(id).value.trim();}
async function createAccount(){
 const required=['name','phone','email','password','confirm','vehicle','vnumber','pincode','address','city'];
 for(const id of required){if(!val(id)){toast('Please fill all required (*) fields.');return;}}
 const email=val('email').toLowerCase();
 const password=val('password');
 if(!/^[0-9]{10}$/.test(val('phone'))){toast('Enter a valid 10-digit mobile number.');return;}
 if(!/^[0-9]{6}$/.test(val('pincode'))){toast('Enter a valid 6-digit pincode.');return;}
 if(password.length<6){toast('Password must be at least 6 characters.');return;}
 if(password!==val('confirm')){toast('Password and Confirm Password do not match.');return;}
 if(!coords){toast('Please select your Current Location.');return;}
 if(!document.getElementById('terms').checked){toast('Please accept Terms & Conditions.');return;}
 const btn=document.querySelector('.btn');
 if(btn){btn.disabled=true;btn.textContent='Creating Account...';}
 try{
   const cred=await auth.createUserWithEmailAndPassword(email,password);
   const user=cred.user;
   await user.updateProfile({displayName:val('name')});
   await user.sendEmailVerification();
   const partner={id:'DP-'+user.uid,name:val('name'),phone:val('phone'),email,uid:user.uid,vehicle:val('vehicle'),number:val('vnumber'),address:val('address'),city:val('city'),state:val('state'),pincode:val('pincode'),latitude:coords.lat,longitude:coords.lng,status:'Pending Approval',emailVerified:false,createdAt:new Date().toISOString()};
   const db=JSON.parse(localStorage.getItem('KumaoniPotliDB')||'{}');
   db.partners=Array.isArray(db.partners)?db.partners:[];
   db.partners=db.partners.filter(p=>p.uid!==user.uid&&p.email!==email);
   db.partners.push(partner);
   localStorage.setItem('KumaoniPotliDB',JSON.stringify(db));
   toast('Verification email sent. Please verify your email, then Sign In.');
   setTimeout(()=>{alert('Verification email sent to '+email+'. Please open your email, verify your address, then return to the Delivery Panel and Sign In. Your account will remain Pending Approval until Admin approves it.');goBack();},900);
 }catch(e){
   let msg='Unable to create account.';
   if(e&&e.code==='auth/email-already-in-use')msg='This email is already registered. Please Sign In.';
   else if(e&&e.code==='auth/invalid-email')msg='Please enter a valid email address.';
   else if(e&&e.code==='auth/weak-password')msg='Password is too weak. Use at least 6 characters.';
   else if(e&&e.message)msg='Firebase: '+e.message;
   toast(msg);
   if(btn){btn.disabled=false;btn.textContent='Create Account';}
 }
}
function goBack(){history.back();}
</script>
