<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Admin Control Center</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#111827;--muted:#64748b;--primary:#4f46e5;--primary2:#7c3aed;--green:#059669;--red:#dc2626;--amber:#d97706;--line:#e5e7eb;--shadow:0 10px 30px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#loader{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),#a855f7,var(--green));z-index:9999;animation:load 1s infinite}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#toast{position:fixed;z-index:10000;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#111827;color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);transition:.25s;max-width:90%;text-align:center}.toast-show{opacity:1!important;transform:translate(-50%,0)!important}.toast.err{background:#991b1b}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#ddd6fe 0,#f8fafc 38%,#eef2ff 100%)}.login-card{width:min(430px,100%);background:white;padding:28px;border-radius:24px;box-shadow:0 20px 60px rgba(15,23,42,.15)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.brand-logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:grid;place-items:center;font-size:25px}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0;color:var(--muted);font-size:13px}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #4f46e51a}.btn{padding:11px 14px;border-radius:11px;font-weight:700;transition:.15s}.btn:active{transform:scale(.98)}.primary{background:var(--primary);color:white}.secondary{background:#eef2ff;color:#3730a3}.success{background:#ecfdf5;color:#047857}.danger{background:#fee2e2;color:#b91c1c}.neutral{background:#f1f5f9;color:#334155}.full{width:100%}.forgot{text-align:center;margin:16px 0}.forgot button{background:none;color:var(--primary);font-weight:700}
#app{min-height:100vh}.topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px}.topbar-inner{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px}.top-title{flex:1;text-align:center}.top-title strong{display:block;font-size:16px}.top-title span{font-size:11px;color:var(--muted)}.icon-btn{width:40px;height:40px;border-radius:11px;background:#f1f5f9;color:#334155;font-size:18px}.page{max-width:1100px;margin:auto;padding:18px 14px 40px}.center-head{text-align:center}.center-head h1{margin:4px 0 4px;font-size:24px}.center-head p{color:var(--muted);margin:0 0 16px}.admin-select{width:min(560px,100%);padding:14px;border:2px solid #c7d2fe;border-radius:14px;background:white;font-weight:800;color:#312e81;box-shadow:var(--shadow)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px}.section-title h2{font-size:18px;margin:0}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr)}.stat{background:var(--card);padding:16px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat .num{font-size:25px;font-weight:900}.stat .lab{font-size:12px;color:var(--muted);margin-top:3px}.cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.panel-card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.panel-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:#eef2ff}.panel-card h3{margin:12px 0 5px}.panel-card p{color:var(--muted);font-size:13px;min-height:38px}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#ecfdf5;color:#047857}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{background:#f8fafc;font-size:12px;color:#475569}tr:last-child td{border-bottom:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{flex:1;min-width:150px;padding:11px;border:1px solid var(--line);border-radius:11px;background:white}.empty{padding:28px;text-align:center;color:var(--muted);background:white;border-radius:16px;border:1px dashed #cbd5e1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;display:grid;place-items:end center;padding:0}.modal-box{background:white;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chart{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.bars{height:170px;display:flex;align-items:end;gap:8px}.bar{flex:1;background:linear-gradient(180deg,#7c3aed,#4f46e5);border-radius:7px 7px 2px 2px;min-height:10px;position:relative}.bar span{position:absolute;bottom:-20px;font-size:10px;color:var(--muted);width:100%;text-align:center}.service{margin-top:14px;text-align:center;padding:11px;border-radius:12px;background:#eef2ff;color:#3730a3;font-weight:800}.food-img{width:54px;height:54px;object-fit:cover;border-radius:10px;background:#e2e8f0}.pill{padding:5px 8px;border-radius:999px;background:#f1f5f9;font-size:11px;font-weight:700}.login-note{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
@media(min-width:700px){.stats{grid-template-columns:repeat(5,1fr)}.modal{place-items:center;padding:20px}.modal-box{border-radius:22px}.page{padding-top:26px}}
</style>

<style id="global-center-fix">
/* Global centered typography/layout */
html,body{ text-align:center !important; }
body,body *{ text-align:center !important; }

h1,h2,h3,h4,h5,h6,p,label,small,strong,span,legend,
.card-title,.section-title,.page-title,.subtitle,.muted,
.stat-label,.stat-value,.badge,.status,.pill,.tag,
button,.btn,.nav-item,.panel-card,.panel-card *,
table,th,td,caption,
input,textarea,select,option{
  text-align:center !important;
}

input,textarea,select{
  display:block;
  margin-left:auto !important;
  margin-right:auto !important;
}

button,.btn{
  justify-content:center !important;
  align-items:center !important;
}

.form-grid,.grid,.cards,.stats,.panel-grid,.actions,.toolbar{
  justify-items:center !important;
}

.card,.panel-card,.stat,.modal,.modal-card,.login-card,
.form-card,.section,.page-section,.empty,.notice{
  text-align:center !important;
}

table{
  margin-left:auto !important;
  margin-right:auto !important;
}

th,td{
  vertical-align:middle !important;
}

ul,ol{
  list-style-position:inside;
  padding-left:0 !important;
}

input::placeholder,textarea::placeholder{
  text-align:center !important;
}
</style>

</head>
<body>
<div id="loader"></div><div id="toast"></div>
<div id="login" class="login">
  <div class="login-card">
    <div class="brand"><div class="brand-logo">🍽️</div><div><h1>Admin Control Center</h1><p>Professional Food Delivery Management</p></div></div>
    <input id="loginEmail" type="hidden" value="">
    <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="Password"></div>
    <button class="btn primary full" onclick="login()">Sign In</button>
    <div class="forgot"><button onclick="forgot()">Forgot Password?</button></div>
    <div class="login-note">Authorized administration only</div>
  </div>
</div>
<div id="app" class="hidden">
  <header class="topbar"><div class="topbar-inner">
    <button class="icon-btn" onclick="history.back()" aria-label="Back">‹</button>
    <div class="top-title"><strong>ADMIN CONTROL CENTER</strong><span id="topSub">Dashboard</span></div>
    <button class="icon-btn" onclick="logout()" aria-label="Logout">⎋</button>
  </div></header>
  <main id="main" class="page"></main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='food_admin_v1';
const pageDefs=[
['dashboard','Dashboard'],['customers','Customer Management'],['restaurants','Restaurant Management'],['delivery','Delivery Management'],['orders','Orders Management'],['foods','Food/Menu Management'],['categories','Categories'],['payments','Payments'],['coupons','Coupons & Offers'],['subscriptions','Subscriptions'],['reviews','Reviews & Ratings'],['notifications','Notifications'],['reports','Reports & Analytics'],['settings','Settings']
];
const seed={
customers:[{id:'C001',name:'Rahul Sharma',phone:'9876543210',email:'rahul@example.com',address:'Haldwani',status:'Active'}],
restaurants:[{id:'R001',name:'Annapurna Kitchen',owner:'Admin',phone:'9876500000',email:'restaurant@example.com',address:'Haldwani',open:'09:00',close:'22:00',delivery:'Yes',rating:'4.8',status:'Active'}],
delivery:[{id:'D001',name:'Amit Kumar',phone:'9876511111',email:'delivery@example.com',address:'Haldwani',vehicle:'Bike',availability:'Available',online:'Online',earnings:0}],
orders:[{id:'ORD001',customer:'Rahul Sharma',phone:'9876543210',address:'Haldwani',restaurant:'Annapurna Kitchen',food:'Aloo Ke Gutke',image:'',qty:2,price:120,total:240,payment:'COD',paymentStatus:'Pending',date:new Date().toISOString().slice(0,10),time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),delivery:'',status:'Pending'}],
foods:[{id:'F001',name:'Aloo Ke Gutke',description:'Traditional Kumaoni potato dish',price:120,category:'Kumaoni',restaurant:'Annapurna Kitchen',available:'Yes',type:'Veg',popular:'Yes',special:'No',image:''}],
categories:[{id:'CAT001',name:'Kumaoni',image:'',status:'Active'}],
payments:[{id:'PAY001',order:'ORD001',customer:'Rahul Sharma',amount:240,method:'COD',status:'Pending',date:new Date().toISOString().slice(0,10),transaction:''}],
coupons:[],subscriptions:[],reviews:[{id:'REV001',customer:'Rahul Sharma',restaurant:'Annapurna Kitchen',food:'Aloo Ke Gutke',rating:5,review:'Very tasty',date:new Date().toISOString().slice(0,10),status:'Visible'}],
notifications:[],
settings:{business:'Maa Annapurna',logo:'',phone:'',email:'',area:'Haldwani',deliveryCharge:30,minOrder:100,radius:10,cod:true,upi:true,card:true,appName:'Maa Annapurna',theme:'Premium',notifications:true,maintenance:false}
};
let db=loadDB(), currentPage='dashboard';
function loadDB(){try{const x=JSON.parse(localStorage.getItem(KEY));return x||structuredClone(seed)}catch(e){return structuredClone(seed)}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function toast(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.className=err?'toast-show err':'toast-show';setTimeout(()=>t.className='',2200)}
function loading(){const l=document.getElementById('loader');l.style.display='block';setTimeout(()=>l.style.display='none',400)}
function login(){const e='admin',p=document.getElementById('loginPass').value;if(!p)return toast('Enter your admin password',true);sessionStorage.setItem('adminLogged','1');openApp();go('dashboard',true)}
function forgot(){toast('Password reset is managed through the configured admin account')}
function logout(){sessionStorage.removeItem('adminLogged');document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function openApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('loginEmail').value=''}
function go(page,replace=false){if(!pageDefs.some(x=>x[0]===page))page='dashboard';currentPage=page;loading();render();if(!replace)history.pushState({page},'', '#'+page)}
window.addEventListener('popstate',e=>{if(e.state?.page)renderPage(e.state.page);else if(currentPage!=='dashboard')renderPage('dashboard');else logout()});
function render(){renderPage(currentPage)}
function renderPage(page){currentPage=page;document.getElementById('topSub').textContent=pageDefs.find(x=>x[0]===page)?.[1]||'Dashboard';render(); if(location.hash!=='#'+page){}}
function render(){
 const m=document.getElementById('main');
 let html=`<div class="center-head"><h1>${pageDefs.find(x=>x[0]===currentPage)?.[1]||'Dashboard'}</h1><p>Manage your food delivery operation</p>
 <select class="admin-select" onchange="go(this.value)">${pageDefs.map(p=>`<option value="${p[0]}" ${p[0]===currentPage?'selected':''}>${p[1]}</option>`).join('')}</select></div>`;
 html+=pages[currentPage]();
 m.innerHTML=html;
 document.getElementById('topSub').textContent=pageDefs.find(x=>x[0]===currentPage)?.[1]||'Dashboard';
}
const pages={};
pages.dashboard=()=>{const o=db.orders,rev=o.filter(x=>x.status==='Delivered').reduce((s,x)=>s+Number(x.total||0),0),today=new Date().toISOString().slice(0,10);const tr=o.filter(x=>x.date===today).reduce((s,x)=>s+Number(x.total||0),0);return `<div class="service">📍 Haldwani delivery only</div><div class="section-title"><h2>Overview</h2></div><div class="grid stats">
${[['👥',db.customers.length,'Total Customers'],['🏪',db.restaurants.length,'Total Restaurants'],['🛵',db.delivery.length,'Delivery Partners'],['🧾',o.length,'Total Orders'],['⏳',o.filter(x=>x.status!=='Delivered'&&x.status!=='Cancelled').length,'Pending Orders'],['✅',o.filter(x=>x.status==='Delivered').length,'Completed Orders'],['❌',o.filter(x=>x.status==='Cancelled').length,'Cancelled Orders'],['₹',money(tr),"Today's Revenue"],['₹',money(rev),'Monthly Revenue'],['🍲',db.foods.filter(x=>x.available==='Yes').length,'Active Food Items']].map(x=>`<div class="stat"><div>${x[0]}</div><div class="num">${x[1]}</div><div class="lab">${x[2]}</div></div>`).join('')}</div>
<div class="section-title"><h2>Manage All Panels</h2></div><div class="grid cards">
${panelCard('👤','Customer Panel','Manage customers, orders, addresses and customer activity','customers')}
${panelCard('🏪','Restaurant Panel','Manage restaurants, menus, food items and restaurant orders','restaurants')}
${panelCard('🛵','Delivery Panel','Manage delivery partners, assignments and delivery status','delivery')}</div>
<div class="section-title"><h2>Order Activity</h2></div><div class="chart"><div class="bars">${[35,55,45,80,62,90,72].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${['M','T','W','T','F','S','S'][i]}</span></div>`).join('')}</div></div>`};
function panelCard(icon,title,desc,page){return `<div class="panel-card"><div class="panel-icon">${icon}</div><h3>${title}</h3><p>${desc}</p><span class="status">● Active</span><div class="actions"><button class="btn primary" onclick="go('${page}')">Open Panel</button><button class="btn secondary" onclick="go('${page}')">Manage</button><button class="btn neutral" onclick="go('settings')">Settings</button></div></div>`}
function toolbar(placeholder,addFn){return `<div class="toolbar"><input id="searchBox" placeholder="${placeholder}" oninput="filterTable(this.value)"><button class="btn primary" onclick="${addFn}">＋ Add</button></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="'+headers.length+'"><div class="empty">No records found</div></td></tr>'}</tbody></table></div>`}
function filterTable(q){document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function btns(type,id){return `<div class="actions"><button class="btn secondary" onclick="editItem('${type}','${id}')">Edit</button><button class="btn danger" onclick="deleteItem('${type}','${id}')">Delete</button></div>`}
pages.customers=()=>toolbar('Search customers...','addCustomer()')+table(['Customer','Contact','Address','Status','Actions'],db.customers.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="pill">${x.id}</span></td><td>${esc(x.phone)}<br>${esc(x.email)}</td><td>${esc(x.address)}</td><td><span class="status">${esc(x.status)}</span></td><td>${btns('customers',x.id)} <button class="btn neutral" onclick="viewCustomer('${x.id}')">View</button></td></tr>`).join(''));
pages.restaurants=()=>toolbar('Search restaurants...','addRestaurant()')+table(['Restaurant','Owner / Contact','Address','Hours','Status','Actions'],db.restaurants.map(x=>`<tr><td><b>${esc(x.name)}</b><br>⭐ ${esc(x.rating)}</td><td>${esc(x.owner)}<br>${esc(x.phone)}<br>${esc(x.email)}</td><td>${esc(x.address)}</td><td>${esc(x.open)} - ${esc(x.close)}<br>Delivery: ${esc(x.delivery)}</td><td><span class="status">${esc(x.status)}</span></td><td>${btns('restaurants',x.id)}<br><button class="btn primary" onclick="go('foods')">Open Restaurant Panel</button></td></tr>`).join(''));
pages.delivery=()=>toolbar('Search delivery partners...','addDelivery()')+table(['Partner','Contact','Vehicle','Availability','Delivery Stats','Actions'],db.delivery.map(x=>`<tr><td><b>${esc(x.name)}</b><br>${x.id}</td><td>${esc(x.phone)}<br>${esc(x.email)}<br>${esc(x.address)}</td><td>${esc(x.vehicle)}</td><td>${esc(x.availability)} / ${esc(x.online)}</td><td>Current: ${esc(x.current||'None')}<br>Completed: ${esc(x.completed||0)}<br>Earnings: ${money(x.earnings)}</td><td>${btns('delivery',x.id)}</td></tr>`).join(''))+
`<div class="section-title"><h2>Order Assignment</h2></div>${table(['Order','Customer','Amount','Status','Delivery Partner','Action'],db.orders.filter(x=>x.status!=='Delivered').map(x=>`<tr><td>${x.id}</td><td>${esc(x.customer)}</td><td>${money(x.total)}</td><td>${esc(x.status)}</td><td>${esc(x.delivery||'Unassigned')}</td><td><button class="btn primary" onclick="assignDelivery('${x.id}')">Assign Delivery</button></td></tr>`).join(''))}`;
pages.orders=()=>`<div class="toolbar"><input placeholder="Search orders..." oninput="filterTable(this.value)"><select onchange="filterStatus(this.value)"><option value="">All Status</option>${['Pending','Confirmed','Preparing','Ready','Assigned','Out for Delivery','Delivered','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select></div>`+table(['Order Details','Customer','Food','Payment','Status','Actions'],db.orders.map(x=>`<tr><td><b>${x.id}</b><br>${esc(x.restaurant)}<br>${esc(x.address)}<br>${esc(x.date)} ${esc(x.time)}</td><td>${esc(x.customer)}<br>${esc(x.phone)}</td><td>${x.image?`<img class="food-img" src="${esc(x.image)}">`:''}<br>${esc(x.food)} × ${x.qty}<br>${money(x.price)} each<br><b>${money(x.total)}</b></td><td>${esc(x.payment)}<br>${esc(x.paymentStatus)}</td><td><span class="pill">${esc(x.status)}</span><br>${esc(x.delivery||'Unassigned')}</td><td><div class="actions"><button class="btn neutral" onclick="viewOrder('${x.id}')">View</button><button class="btn secondary" onclick="editOrder('${x.id}')">Edit</button><button class="btn primary" onclick="updateOrderStatus('${x.id}')">Update Status</button><button class="btn success" onclick="assignDelivery('${x.id}')">Assign Delivery</button><button class="btn neutral" onclick="printOrder('${x.id}')">Print</button><button class="btn danger" onclick="deleteItem('orders','${x.id}')">Delete</button></div></td></tr>`).join(''));
function filterStatus(v){document.querySelectorAll('tbody tr').forEach(r=>r.style.display=!v||r.innerText.includes(v)?'':'none')}
pages.foods=()=>toolbar('Search food items...','addFood()')+table(['Food','Price','Category / Restaurant','Options','Image','Actions'],db.foods.map(x=>`<tr><td><b>${esc(x.name)}</b><br>${esc(x.description)}</td><td>${money(x.price)}</td><td>${esc(x.category)}<br>${esc(x.restaurant)}</td><td>${esc(x.type)}<br>Available: ${esc(x.available)}<br>Popular: ${esc(x.popular)}<br>Special: ${esc(x.special)}</td><td>${x.image?`<img class="food-img" src="${esc(x.image)}">`:'No image'}</td><td>${btns('foods',x.id)}</td></tr>`).join(''));
pages.categories=()=>toolbar('Search categories...','addCategory()')+table(['Category','Image','Status','Actions'],db.categories.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.image?`<img class="food-img" src="${esc(x.image)}">`:'No image'}</td><td><span class="status">${esc(x.status)}</span></td><td>${btns('categories',x.id)}</td></tr>`).join(''));
pages.payments=()=>`<div class="toolbar"><select onchange="filterTable(this.value)"><option value="">All Payments</option><option>Pending</option><option>Paid</option><option>Failed</option><option>Refunded</option></select></div>`+table(['Order','Customer','Amount','Method','Status','Date / Transaction'],db.payments.map(x=>`<tr><td>${x.order}</td><td>${esc(x.customer)}</td><td>${money(x.amount)}</td><td>${esc(x.method)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${esc(x.date)}<br>${esc(x.transaction||'—')}</td></tr>`).join(''));
pages.coupons=()=>toolbar('Search coupons...','addCoupon()')+table(['Code','Discount','Order Rules','Validity','Status','Actions'],db.coupons.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.type)} ${esc(x.value)}</td><td>Min ${money(x.min)}<br>Max ${money(x.max)}</td><td>${esc(x.start)} → ${esc(x.expiry)}</td><td>${esc(x.status)}</td><td>${btns('coupons',x.id)}</td></tr>`).join(''));
pages.subscriptions=()=>toolbar('Search plans...','addSubscription()')+table(['Plan','Price','Duration','Benefits','Status','Subscribers','Actions'],db.subscriptions.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.price)}</td><td>${esc(x.duration)}</td><td>${esc(x.benefits)}</td><td>${esc(x.status)}</td><td>${x.subscribers||0}</td><td>${btns('subscriptions',x.id)}</td></tr>`).join(''));
pages.reviews=()=>table(['Customer','Restaurant','Food','Rating','Review','Date','Status','Actions'],db.reviews.map(x=>`<tr><td>${esc(x.customer)}</td><td>${esc(x.restaurant)}</td><td>${esc(x.food)}</td><td>⭐ ${esc(x.rating)}</td><td>${esc(x.review)}</td><td>${esc(x.date)}</td><td>${esc(x.status)}</td><td><button class="btn secondary" onclick="toggleReview('${x.id}')">Hide/Show</button><button class="btn danger" onclick="deleteItem('reviews','${x.id}')">Delete</button></td></tr>`).join(''));
pages.notifications=()=>toolbar('Search notifications...','addNotification()')+table(['Title','Message','Target','Date','Status','Actions'],db.notifications.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.message)}</td><td>${esc(x.target)}</td><td>${esc(x.date)}</td><td>${esc(x.status)}</td><td>${btns('notifications',x.id)}</td></tr>`).join(''));
pages.reports=()=>`<div class="grid stats"><div class="stat"><div class="num">${db.orders.length}</div><div class="lab">Daily Orders</div></div><div class="stat"><div class="num">${db.orders.length}</div><div class="lab">Weekly Orders</div></div><div class="stat"><div class="num">${money(db.orders.reduce((s,x)=>s+Number(x.total||0),0))}</div><div class="lab">Revenue</div></div><div class="stat"><div class="num">${db.customers.length}</div><div class="lab">Customers</div></div><div class="stat"><div class="num">${db.restaurants.length}</div><div class="lab">Restaurants</div></div></div><div class="section-title"><h2>Performance</h2></div><div class="grid cards"><div class="chart"><b>Order Trend</b><div class="bars">${[40,65,35,75,55,88,70].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${i+1}</span></div>`).join('')}</div></div><div class="chart"><b>Popular Foods</b><ol>${db.foods.slice(0,5).map(x=>`<li>${esc(x.name)} — ${money(x.price)}</li>`).join('')||'<li>No foods</li>'}</ol></div></div>`;
pages.settings=()=>`<form onsubmit="saveSettings(event)"><div class="section-title"><h2>Business Settings</h2></div><div class="grid cards"><div class="field"><label>Business Name</label><input name="business" value="${esc(db.settings.business)}"></div><div class="field"><label>Logo URL</label><input name="logo" value="${esc(db.settings.logo)}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(db.settings.phone)}"></div><div class="field"><label>Email</label><input name="email" value="${esc(db.settings.email)}"></div><div class="field"><label>Service Area</label><input name="area" value="${esc(db.settings.area)}"></div></div><div class="section-title"><h2>Delivery Settings</h2></div><div class="grid cards"><div class="field"><label>Delivery Charge</label><input name="deliveryCharge" type="number" value="${db.settings.deliveryCharge}"></div><div class="field"><label>Minimum Order</label><input name="minOrder" type="number" value="${db.settings.minOrder}"></div><div class="field"><label>Delivery Radius (km)</label><input name="radius" type="number" value="${db.settings.radius}"></div></div><div class="section-title"><h2>Payment & App Settings</h2></div><div class="grid cards"><label class="panel-card"><input type="checkbox" name="cod" ${db.settings.cod?'checked':''}> COD ON</label><label class="panel-card"><input type="checkbox" name="upi" ${db.settings.upi?'checked':''}> UPI ON</label><label class="panel-card"><input type="checkbox" name="card" ${db.settings.card?'checked':''}> Card ON</label><label class="panel-card"><input type="checkbox" name="notifications" ${db.settings.notifications?'checked':''}> Notifications ON</label><label class="panel-card"><input type="checkbox" name="maintenance" ${db.settings.maintenance?'checked':''}> Maintenance Mode</label></div><div class="actions"><button class="btn primary" type="submit">Save Settings</button><button class="btn neutral" type="button" onclick="resetData()">Reset Demo Data</button></div></form>`;
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function formField(n,l,v='',type='text',extra=''){return `<div class="field"><label>${l}</label><input name="${n}" type="${type}" value="${esc(v)}" ${extra}></div>`}
function openForm(type,item={}){const labels={
customers:['Customer', [['name','Name'],['phone','Phone'],['email','Email'],['address','Address'],['status','Status']]],
restaurants:['Restaurant',[['name','Restaurant Name'],['owner','Owner Name'],['phone','Phone'],['email','Email'],['address','Address'],['open','Opening Time'],['close','Closing Time'],['delivery','Delivery Availability'],['rating','Rating'],['status','Status']]],
delivery:['Delivery Partner',[['name','Name'],['phone','Phone'],['email','Email'],['address','Address'],['vehicle','Vehicle Details'],['availability','Availability'],['online','Online/Offline'],['earnings','Delivery Earnings','number']]],
foods:['Food Item',[['name','Food Name'],['description','Description'],['price','Price','number'],['category','Category'],['restaurant','Restaurant'],['available','Availability'],['type','Veg/Non-Veg'],['popular','Popular Item'],['special','Special Item'],['image','Food Image URL']]],
categories:['Category',[['name','Category Name'],['image','Category Image URL'],['status','Status']]],
coupons:['Coupon',[['code','Coupon Code'],['type','Discount Type'],['value','Discount Value'],['min','Minimum Order','number'],['max','Maximum Discount','number'],['start','Start Date'],['expiry','Expiry Date'],['status','Active/Inactive']]],
subscriptions:['Subscription Plan',[['name','Plan Name'],['price','Price','number'],['duration','Duration'],['benefits','Benefits'],['status','Active/Inactive'],['subscribers','Subscriber Count','number']]],
notifications:['Notification',[['title','Title'],['message','Message'],['target','Target'],['date','Date'],['status','Status']]]
};
const spec=labels[type];if(!spec)return;let fields=spec[1].map(a=>formField(a[0],a[1],item[a[0]]??'',a[2]||'text')).join('');modal((item.id?'Edit ':'Add ')+spec[0],`<form onsubmit="saveItem(event,'${type}','${item.id||''}')"><div class="two">${fields}</div><div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn neutral" type="button" onclick="closeModal()">Cancel</button></div></form>`)}
function addCustomer(){openForm('customers')}function addRestaurant(){openForm('restaurants')}function addDelivery(){openForm('delivery')}function addFood(){openForm('foods')}function addCategory(){openForm('categories')}function addCoupon(){openForm('coupons')}function addSubscription(){openForm('subscriptions')}function addNotification(){openForm('notifications')}
function saveItem(e,type,id){e.preventDefault();const data=Object.fromEntries(new FormData(e).entries());if(['price','min','max','earnings','subscribers'].some(k=>k in data))for(const k of Object.keys(data))if(['price','min','max','earnings','subscribers'].includes(k))data[k]=Number(data[k]||0);if(id){const i=db[type].findIndex(x=>x.id===id);db[type][i]={...db[type][i],...data}}else{data.id=prefix(type)+String(Date.now()).slice(-5);db[type].push(data)}saveDB();closeModal();render();toast(id?'Updated successfully':'Added successfully')}
function prefix(t){return ({customers:'C',restaurants:'R',delivery:'D',foods:'F',categories:'CAT',coupons:'CP',subscriptions:'SUB',notifications:'N',reviews:'REV'})[t]||'ID'}
function editItem(type,id){const x=db[type].find(x=>x.id===id);openForm(type,x)}
function deleteItem(type,id){if(!confirm('Delete this record?'))return;db[type]=db[type].filter(x=>x.id!==id);saveDB();render();toast('Deleted successfully')}
function viewCustomer(id){const x=db.customers.find(x=>x.id===id);modal('Customer Details',`<p><b>${esc(x.name)}</b></p><p>Phone: ${esc(x.phone)}<br>Email: ${esc(x.email)}<br>Address: ${esc(x.address)}<br>Status: ${esc(x.status)}</p>`)}
function viewOrder(id){const x=db.orders.find(x=>x.id===id);modal('Order Details',`<p><b>${x.id}</b></p><p>Customer: ${esc(x.customer)}<br>Phone: ${esc(x.phone)}<br>Address: ${esc(x.address)}<br>Restaurant: ${esc(x.restaurant)}<br>Food: ${esc(x.food)} × ${x.qty}<br>Total: ${money(x.total)}<br>Payment: ${esc(x.payment)} (${esc(x.paymentStatus)})<br>Status: ${esc(x.status)}<br>Delivery: ${esc(x.delivery||'Unassigned')}</p>`)}
function editOrder(id){const x=db.orders.find(x=>x.id===id);modal('Edit Order',`<form onsubmit="saveOrder(event,'${id}')">${formField('status','Order Status',x.status)}${formField('paymentStatus','Payment Status',x.paymentStatus)}${formField('delivery','Delivery Partner',x.delivery||'')}<div class="actions"><button class="btn primary">Save</button></div></form>`)}
function saveOrder(e,id){e.preventDefault();Object.assign(db.orders.find(x=>x.id===id),Object.fromEntries(new FormData(e).entries()));saveDB();closeModal();render();toast('Order updated successfully')}
function updateOrderStatus(id){const x=db.orders.find(x=>x.id===id);const i=['Pending','Confirmed','Preparing','Ready','Assigned','Out for Delivery','Delivered'].indexOf(x.status);x.status=i<6?['Pending','Confirmed','Preparing','Ready','Assigned','Out for Delivery','Delivered'][i+1]:'Delivered';saveDB();render();toast('Order status updated')}
function assignDelivery(orderId){if(!db.delivery.length)return toast('Add a delivery partner first',true);modal('Assign Delivery Partner',db.delivery.map(d=>`<button class="btn ${d.online==='Online'?'primary':'neutral'} full" style="margin-top:8px" onclick="doAssign('${orderId}','${d.id}')">🛵 ${esc(d.name)} — ${esc(d.online)}</button>`).join(''))}
function doAssign(orderId,did){const o=db.orders.find(x=>x.id===orderId),d=db.delivery.find(x=>x.id===did);o.delivery=d.name;o.status='Assigned';d.current=orderId;d.availability='Busy';saveDB();closeModal();render();toast('Delivery partner assigned')}
function printOrder(id){const x=db.orders.find(x=>x.id===id),w=window.open('','_blank');if(!w)return;w.document.write(`<h2>Order ${x.id}</h2><p>${esc(x.customer)}<br>${esc(x.address)}<br>${esc(x.food)} × ${x.qty}<br>Total: ${money(x.total)}<br>Status: ${esc(x.status)}</p>`);w.print()}
function toggleReview(id){const x=db.reviews.find(x=>x.id===id);x.status=x.status==='Visible'?'Hidden':'Visible';saveDB();render()}
function saveSettings(e){e.preventDefault();const f=new FormData(e);db.settings={...db.settings,business:f.get('business'),logo:f.get('logo'),phone:f.get('phone'),email:f.get('email'),area:f.get('area'),deliveryCharge:Number(f.get('deliveryCharge')),minOrder:Number(f.get('minOrder')),radius:Number(f.get('radius')),cod:f.has('cod'),upi:f.has('upi'),card:f.has('card'),notifications:f.has('notifications'),maintenance:f.has('maintenance')};saveDB();toast('Settings saved successfully')}
function resetData(){if(confirm('Reset all local demo data?')){db=structuredClone(seed);saveDB();render();toast('Demo data reset')}}
if(sessionStorage.getItem('adminLogged')==='1')openApp(); else document.getElementById('loginEmail').value='';
if(location.hash&&pageDefs.some(x=>x[0]===location.hash.slice(1))&&sessionStorage.getItem('adminLogged')==='1'){currentPage=location.hash.slice(1);history.replaceState({page:currentPage},'',location.hash);render()}else{history.replaceState({page:'dashboard'},'','#dashboard')}
</script>
</body>
</html>
