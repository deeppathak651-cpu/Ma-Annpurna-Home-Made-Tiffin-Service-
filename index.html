<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f7f7f7;
 color:#222;
 padding-bottom:78px;
}

/* =========================
   TOP HEADER
========================= */

header{
 background:#fff;
 color:#222;
 padding:12px 15px;
 position:sticky;
 top:0;
 z-index:50;
 box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.logo{
 font-size:19px;
 font-weight:800;
 color:#e65100;
}

.small{
 font-size:11px;
 color:#777;
 margin-top:2px;
}

header .badge{
 background:#e65100;
 color:#fff;
 border-radius:20px;
 padding:6px 10px;
 font-size:10px;
 font-weight:bold;
}

header .role-badge{
 background:#212121;
 color:#fff;
 border-radius:20px;
 padding:6px 10px;
 font-size:10px;
 font-weight:bold;
}

/* =========================
   MAIN CONTAINER
========================= */

.container{
 width:100%;
 max-width:760px;
 margin:auto;
 padding:14px;
}

/* =========================
   PAGES
========================= */

.page{
 display:none;
 padding-bottom:20px;
}

.page.active{
 display:block;
}

/* =========================
   HOME HERO
========================= */

.banner{
 background:#fff;
 border-radius:20px;
 padding:18px;
 margin:12px 0;
 box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.banner h2{
 margin:0 0 8px;
 color:#e65100;
 font-size:24px;
}

.banner h3{
 margin-top:0;
}

.banner p{
 color:#666;
 line-height:1.5;
}

/* First home banner */
#home .banner:first-child{
 background:linear-gradient(135deg,#fff3e0,#ffe0b2);
 border:1px solid #ffcc80;
}

/* =========================
   SECTION TITLES
========================= */

.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 margin:20px 0 10px;
}

.section-title h2,
.section-title h3{
 margin:0;
 font-size:19px;
}

.section-title h2{
 color:#222;
}

/* =========================
   SEARCH
========================= */

.search-box{
 position:relative;
 margin:12px 0;
}

.search-box input{
 padding:14px 15px 14px 45px;
 border:0;
 border-radius:15px;
 background:#fff;
 box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.search-icon{
 position:absolute;
 left:16px;
 top:15px;
 z-index:2;
 font-size:17px;
}

/* =========================
   CATEGORY
========================= */

.category-row{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding:5px 0 12px;
 scrollbar-width:none;
}

.category-row::-webkit-scrollbar{
 display:none;
}

.category-row button{
 white-space:nowrap;
 background:#fff;
 color:#555;
 border:1px solid #eee;
 border-radius:20px;
 padding:9px 16px;
 min-height:38px;
 font-size:12px;
 box-shadow:none;
}

.category-row button.active{
 background:#e65100;
 color:#fff;
 border-color:#e65100;
}

/* =========================
   FOOD GRID
========================= */

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

/* =========================
   FOOD CARD
========================= */

.menu-card{
 background:#fff;
 border-radius:18px;
 padding:9px;
 box-shadow:0 3px 12px rgba(0,0,0,.07);
 overflow:hidden;
}

.food-img,
.menu-card img{
 width:100%;
 height:125px;
 object-fit:cover;
 border-radius:14px;
 display:block;
 background:#eee;
}

.food-name{
 font-weight:700;
 font-size:14px;
 margin:9px 3px 3px;
 line-height:1.3;
}

.price{
 color:#e65100;
 font-size:17px;
 font-weight:800;
 margin:5px 3px;
}

.desc{
 font-size:11px;
 color:#777;
 line-height:1.4;
 margin:3px;
 min-height:31px;
}

.menu-card button{
 width:100%;
 margin-top:7px;
}

/* =========================
   BUTTONS
========================= */

button{
 border:0;
 border-radius:12px;
 padding:11px 14px;
 background:#e65100;
 color:#fff;
 font-weight:700;
 cursor:pointer;
 min-height:42px;
 font-size:13px;
 transition:.15s;
}

button:active{
 transform:scale(.97);
}

button.secondary{
 background:#555;
}

button.green{
 background:#198754;
}

button.red{
 background:#dc3545;
}

button.blue{
 background:#0d6efd;
}

button.dark{
 background:#212529;
}

button.light{
 background:#f1f1f1;
 color:#333;
}

button.full{
 width:100%;
 margin-top:8px;
}

button:disabled{
 opacity:.55;
 cursor:not-allowed;
}

.small-btn{
 padding:7px 10px;
 font-size:11px;
 min-height:34px;
}

/* =========================
   CART
========================= */

.card,
.order{
 background:#fff;
 border-radius:18px;
 padding:15px;
 margin:12px 0;
 box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.info-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin:8px 0;
}

.qty{
 display:flex;
 align-items:center;
 gap:8px;
}

.qty button{
 padding:5px 10px;
 min-height:32px;
 border-radius:9px;
}

.total{
 font-size:21px;
 font-weight:800;
 color:#e65100;
}

/* =========================
   CART NAV
========================= */

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:70px;
 background:#fff;
 display:flex;
 justify-content:space-around;
 align-items:center;
 padding:5px 3px;
 box-shadow:0 -3px 15px rgba(0,0,0,.12);
 z-index:100;
 border-radius:18px 18px 0 0;
}

.nav button{
 background:transparent;
 color:#777;
 padding:4px 3px;
 min-height:55px;
 flex:1;
 border-radius:12px;
 font-size:10px;
}

.nav button.active{
 color:#e65100;
 background:#fff3e8;
}

.nav-icon{
 display:block;
 font-size:20px;
 margin-bottom:3px;
}

/* =========================
   BADGES
========================= */

.badge{
 background:#e65100;
 color:#fff;
 border-radius:20px;
 padding:5px 9px;
 font-size:11px;
}

.status{
 display:inline-block;
 padding:6px 10px;
 border-radius:20px;
 background:#fff0dd;
 color:#e65100;
 font-size:11px;
 font-weight:700;
}

.role-badge{
 background:#212529;
 color:#fff;
 border-radius:20px;
 padding:5px 9px;
 font-size:11px;
}

/* =========================
   FORMS
========================= */

input,
select,
textarea{
 width:100%;
 padding:13px;
 border:1px solid #e2e2e2;
 border-radius:12px;
 margin:5px 0 10px;
 font-size:15px;
 background:#fff;
 outline:none;
}

input:focus,
select:focus,
textarea:focus{
 border-color:#ff9800;
 box-shadow:0 0 0 3px rgba(255,152,0,.12);
}

textarea{
 min-height:90px;
 resize:vertical;
}

/* =========================
   AUTH
========================= */

.auth-card{
 max-width:500px;
 margin:25px auto;
}

#auth .banner{
 text-align:left;
}

#auth .banner h2{
 text-align:center;
 font-size:25px;
}

#authMessage{
 text-align:center;
 color:#777;
}

/* =========================
   NOTICE
========================= */

.notice{
 background:#fff8e1;
 color:#795548;
 padding:12px;
 border-radius:12px;
 margin:10px 0;
 font-size:13px;
}

.success{
 background:#d1e7dd;
 color:#0f5132;
 padding:11px;
 border-radius:12px;
 margin:10px 0;
}

.error{
 background:#f8d7da;
 color:#842029;
 padding:11px;
 border-radius:12px;
 margin:10px 0;
}

/* =========================
   ORDER ITEMS
========================= */

.order-item{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:10px 0;
 border-bottom:1px solid #eee;
 font-size:13px;
}

/* =========================
   PROFILE
========================= */

#profile .card:first-of-type{
 text-align:left;
}

#profileName{
 font-size:21px;
 margin-bottom:3px;
 color:#e65100;
}

.muted{
 color:#777;
 font-size:13px;
}

/* =========================
   ADMIN
========================= */

.admin,
.restaurant,
.delivery{
 background:#f5f5f5;
 min-height:100%;
}

.admin .card,
.restaurant .card,
.delivery .card{
 color:#222;
}

.stat-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.stat{
 text-align:center;
 padding:16px 8px;
 background:#fff;
 border-radius:16px;
 box-shadow:0 3px 10px rgba(0,0,0,.06);
 font-size:12px;
 color:#777;
}

.stat b{
 display:block;
 font-size:24px;
 color:#e65100;
 margin-top:6px;
}

.top-actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}

.top-actions button{
 flex:1;
 min-width:100px;
}

.assignment{
 border:1px solid #eee;
 border-radius:14px;
 padding:12px;
 margin-top:9px;
 background:#fff;
}

.admin-table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
}

.admin-table th,
.admin-table td{
 border-bottom:1px solid #eee;
 padding:9px 5px;
 text-align:left;
}

.admin-table th{
 background:#f7f7f7;
}

.pill{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:10px;
 background:#eee;
}

.pill.green{
 background:#d1e7dd;
 color:#0f5132;
}

.pill.orange{
 background:#fff0dd;
 color:#9a4d00;
}

.pill.red{
 background:#f8d7da;
 color:#842029;
}

/* =========================
   EMPTY
========================= */

.empty{
 text-align:center;
 padding:40px 10px;
 color:#777;
}

.empty button{
 margin-top:10px;
}

/* =========================
   TOAST
========================= */

.toast{
 position:fixed;
 left:50%;
 bottom:85px;
 transform:translateX(-50%);
 background:#212529;
 color:#fff;
 padding:12px 17px;
 border-radius:14px;
 z-index:1000;
 box-shadow:0 4px 18px rgba(0,0,0,.25);
 font-size:13px;
 max-width:90%;
 text-align:center;
}

/* =========================
   HR
========================= */

hr{
 border:0;
 border-top:1px solid #eee;
 margin:15px 0;
}

/* =========================
   PROVIDER
========================= */

.provider{
 border:1px solid #eee;
 border-radius:15px;
 padding:12px;
 margin:10px 0;
 background:#fff;
}

.provider-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.provider-logo{
 width:52px;
 height:52px;
 border-radius:50%;
 background:#ffe0b2;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:25px;
}

.stars{
 color:#f59e0b;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

 body{
  padding-bottom:76px;
 }

 header{
  padding:11px 13px;
 }

 .container{
  padding:10px;
 }

 .logo{
  font-size:17px;
 }

 .small{
  font-size:10px;
 }

 .grid{
  grid-template-columns:repeat(2,1fr);
  gap:9px;
 }

 .food-img,
 .menu-card img{
  height:112px;
 }

 .menu-card{
  padding:8px;
  border-radius:16px;
 }

 .food-name{
  font-size:13px;
 }

 .price{
  font-size:16px;
 }

 .desc{
  font-size:10px;
 }

 .menu-card button{
  min-height:38px;
  padding:8px;
  font-size:11px;
 }

 .banner{
  padding:15px;
  border-radius:18px;
 }

 .banner h2{
  font-size:22px;
 }

 .card,
 .order{
  padding:13px;
  border-radius:17px;
 }

 .section-title{
  margin-top:16px;
 }

 .section-title h2,
 .section-title h3{
  font-size:17px;
 }

 .nav{
  height:68px;
 }

 .nav button{
  font-size:9px;
 }

 .nav-icon{
  font-size:19px;
 }

 .stat{
  padding:14px 5px;
 }

 .stat b{
  font-size:22px;
 }

}

/* =========================
   EXTRA SMALL MOBILE
========================= */

@media(max-width:360px){

 .grid{
  gap:7px;
 }

 .food-img,
 .menu-card img{
  height:100px;
 }

 .food-name{
  font-size:12px;
 }

 .price{
  font-size:15px;
 }

 .nav-icon{
  font-size:18px;
 }

 .nav button{
  font-size:8px;
 }

}

/* =========================
   HIDDEN
========================= */

.hidden{
 display:none!important;
}
</style>
