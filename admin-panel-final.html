<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Kumaoni Potli Admin Panel</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#64748b;--primary:#4f46e5;--primary2:#7c3aed;--green:#059669;--red:#dc2626;--amber:#d97706;--line:#e2e8f0;--shadow:0 10px 30px rgba(15,23,42,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;text-align:center}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#loader{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),#a855f7,var(--green));z-index:9999;display:none;animation:load 1s infinite}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#toast{position:fixed;z-index:10000;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#111827;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);transition:.25s;max-width:90%;pointer-events:none}.toast-show{opacity:1!important;transform:translate(-50%,0)!important}.toast.err{background:#991b1b}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#ddd6fe 0,#f8fafc 38%,#eef2ff 100%)}.login-card{width:min(430px,100%);background:#fff;padding:28px;border-radius:24px;box-shadow:0 20px 60px rgba(15,23,42,.15)}.brand{margin-bottom:24px}.brand-logo{width:58px;height:58px;margin:0 auto 12px;border-radius:17px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;font-size:27px}.brand h1{font-size:21px;margin:0}.brand p{margin:5px 0;color:var(--muted);font-size:13px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;text-align:center}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #4f46e51a}.btn{padding:11px 14px;border-radius:11px;font-weight:800;transition:.15s}.btn:active{transform:scale(.98)}.primary{background:var(--primary);color:#fff}.secondary{background:#eef2ff;color:#3730a3}.success{background:#ecfdf5;color:#047857}.danger{background:#fee2e2;color:#b91c1c}.neutral{background:#f1f5f9;color:#334155}.full{width:100%}.forgot{margin:16px 0}.forgot button{background:none;color:var(--primary);font-weight:800}.login-note{font-size:12px;color:var(--muted);margin-top:12px}
#app{min-height:100vh}.topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px}.topbar-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:center}.top-title{width:100%;text-align:center}.top-title strong{display:block;font-size:16px}.top-title span{font-size:11px;color:var(--muted)}.logout-btn{position:absolute;right:14px;width:40px;height:40px;border-radius:11px;background:#f1f5f9;color:#334155;font-size:18px}
.page{max-width:1100px;margin:auto;padding:18px 14px 50px}.launcher{background:linear-gradient(135deg,#fff,#f8f7ff);border:1px solid #dbe3ff;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}.launcher h1{font-size:23px;margin:2px 0 5px}.launcher p{color:var(--muted);font-size:13px;margin:0 0 13px}.panel-select,.admin-select{width:min(600px,100%);padding:14px 15px;border:2px solid #c7d2fe;border-radius:14px;background:#fff;font-weight:900;color:#312e81;box-shadow:0 5px 18px rgba(79,70,229,.08);text-align:center}.section-title{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0 12px}.section-title h2{font-size:18px;margin:0}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr)}.stat{background:#fff;padding:16px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat .icon{font-size:23px}.stat .num{font-size:24px;font-weight:900;margin-top:3px}.stat .lab{font-size:12px;color:var(--muted);margin-top:3px}.cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.panel-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.panel-icon{width:52px;height:52px;margin:auto;border-radius:15px;display:grid;place-items:center;font-size:24px;background:#eef2ff}.panel-card h3{margin:12px 0 5px}.panel-card p{color:var(--muted);font-size:13px;min-height:38px}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#ecfdf5;color:#047857}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:center;padding:12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{background:#f8fafc;font-size:12px;color:#475569}tr:last-child td{border-bottom:0}.toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{width:min(420px,100%);padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:center}.empty{padding:28px;color:var(--muted)}.food-img{width:54px;height:54px;object-fit:cover;border-radius:10px;background:#e2e8f0}.pill{padding:5px 8px;border-radius:999px;background:#f1f5f9;font-size:11px;font-weight:800}.service{margin:14px auto;padding:11px;max-width:600px;border-radius:12px;background:#eef2ff;color:#3730a3;font-weight:900}.notice{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:18px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;display:grid;place-items:end center;padding:0}.modal-box{background:#fff;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.modal-head{display:flex;justify-content:center;align-items:center;position:relative}.modal-head h3{margin:0}.modal-close{position:absolute;right:0;top:-4px;width:38px;height:38px;border-radius:10px;background:#f1f5f9;font-size:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chart{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.bars{height:170px;display:flex;align-items:end;gap:8px}.bar{flex:1;background:linear-gradient(180deg,#7c3aed,#4f46e5);border-radius:7px 7px 2px 2px;min-height:10px;position:relative}.bar span{position:absolute;bottom:-20px;font-size:10px;color:var(--muted);width:100%;left:0}.panel-home{padding-top:4px}.panel-home .panel-icon{margin-bottom:8px}
@media(min-width:700px){.stats{grid-template-columns:repeat(5,1fr)}.modal{place-items:center;padding:20px}.modal-box{border-radius:22px}.page{padding-top:26px}}
@media(max-width:560px){.two{grid-template-columns:1fr}.actions .btn{min-width:120px}.launcher{padding:16px}}
</style>
</head>
<body>
<div id="loader"></div><div id="toast"></div>
<div id="login" class="login">
  <div class="login-card">
    <div class="brand"><div class="brand-logo">🍽️</div><h1>Admin Control Center</h1><p>Professional Food Delivery Management</p></div>
    <input id="loginEmail" type="hidden" value="admin">
    <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn primary full" onclick="login()">Sign In</button>
    <div class="forgot"><button onclick="forgot()">Forgot Password?</button></div>
    <div class="login-note">Authorized administration only</div>
  </div>
</div>
<div id="app" class="hidden">
<header class="topbar"><div class="topbar-inner"><div class="top-title"><strong>KUMAONI POTLI ADMIN PANEL</strong><span id="topSub">Select Panel</span></div><button class="logout-btn" onclick="logout()" aria-label="Logout">⎋</button></div></header>
<main id="main" class="page"></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='food_admin_v2';
const PANEL_DEFS=[['customer','👤','Customer Panel'],['restaurant','🏪','Restaurant Panel'],['delivery','🛵','Delivery Panel'],['admin','⚙️','Admin Panel']];
const ADMIN_PAGES=[['dashboard','Dashboard'],['customers','Customer Management'],['restaurants','Restaurant Management'],['delivery','Delivery Management'],['orders','Order Management'],['foods','Food/Menu Management'],['categories','Categories'],['payments','Payments'],['coupons','Coupons & Offers'],['subscriptions','Subscriptions'],['reviews','Reviews & Ratings'],['notifications','Notifications'],['reports','Reports / Settings']];
const seed={customers:[{id:'C001',name:'Rahul Sharma',phone:'9876543210',email:'rahul@example.com',address:'Haldwani',status:'Active'}],restaurants:[{id:'R001',name:'Annapurna Kitchen',owner:'Admin',phone:'9876500000',email:'restaurant@example.com',address:'Haldwani',open:'09:00',close:'22:00',delivery:'Yes',rating:'4.8',status:'Active'}],delivery:[{id:'D001',name:'Amit Kumar',phone:'9876511111',email:'delivery@example.com',address:'Haldwani',vehicle:'Bike',availability:'Available',online:'Online',earnings:0}],orders:[{id:'ORD001',customer:'Rahul Sharma',phone:'9876543210',address:'Haldwani',restaurant:'Annapurna Kitchen',food:'Aloo Ke Gutke',image:'',qty:2,price:120,total:240,payment:'COD',paymentStatus:'Pending',date:new Date().toISOString().slice(0,10),time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),delivery:'',status:'Pending'}],foods:[{id:'F001',name:'Aloo Ke Gutke',description:'Traditional Kumaoni potato dish',price:120,category:'Kumaoni',restaurant:'Annapurna Kitchen',available:'Yes',type:'Veg',popular:'Yes',special:'No',image:''}],categories:[{id:'CAT001',name:'Kumaoni',image:'',status:'Active'}],payments:[{id:'PAY001',order:'ORD001',customer:'Rahul Sharma',amount:240,method:'COD',status:'Pending',date:new Date().toISOString().slice(0,10),transaction:''}],coupons:[],subscriptions:[],reviews:[{id:'REV001',customer:'Rahul Sharma',restaurant:'Annapurna Kitchen',food:'Aloo Ke Gutke',rating:5,review:'Very tasty',date:new Date().toISOString().slice(0,10),status:'Visible'}],notifications:[],settings:{business:'Kumaoni Potli',logo:'',phone:'',email:'',area:'Haldwani',deliveryCharge:30,minOrder:100,radius:10,cod:true,upi:true,card:true,notifications:true,maintenance:false}};
let db=loadDB(), currentPanel=null, currentAdminPage='dashboard', navReady=false;
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||clone(seed)}catch(e){return clone(seed)}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function toast(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.className=err?'toast-show err':'toast-show';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.className='',2200)}
function loading(){const l=document.getElementById('loader');l.style.display='block';clearTimeout(window.__load);window.__load=setTimeout(()=>l.style.display='none',350)}
function login(){const p=document.getElementById('loginPass').value.trim();if(!p){toast('Enter your admin password',true);return}sessionStorage.setItem('adminLogged','1');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');currentPanel=null;currentAdminPage='dashboard';history.replaceState({screen:'launcher'},'',location.pathname+'#launcher');renderLauncher()}
function forgot(){toast('Password reset is managed through the configured admin account')}
function logout(){sessionStorage.removeItem('adminLogged');currentPanel=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('loginPass').value='';history.replaceState({screen:'login'},'',location.pathname)}
function panelTitle(){return PANEL_DEFS.find(x=>x[0]===currentPanel)?.[2]||'Select Panel'}
function renderLauncher(){loading();document.getElementById('topSub').textContent='Select Panel';document.getElementById('main').innerHTML=`<section class="launcher"><h1>SELECT PANEL</h1><p>Choose the panel you want to open</p><select class="panel-select" onchange="selectPanel(this.value)"><option value="">Select Panel</option>${PANEL_DEFS.map(p=>`<option value="${p[0]}">${p[1]} ${p[2]}</option>`).join('')}</select></section><div class="section-title"><h2>Four Application Panels</h2></div><div class="grid cards">${PANEL_DEFS.map(p=>panelLauncherCard(p)).join('')}</div>`}
function panelLauncherCard(p){return `<div class="panel-card"><div class="panel-icon">${p[1]}</div><h3>${p[2]}</h3><p>Open and manage this application panel.</p><button class="btn primary full" onclick="selectPanel('${p[0]}')">Open ${p[2]}</button></div>`}
function selectPanel(panel){if(!PANEL_DEFS.some(x=>x[0]===panel)){renderLauncher();return}currentPanel=panel;loading();history.pushState({screen:'panel',panel},'',location.pathname+'#panel-'+panel);renderPanel()}
function renderPanel(){document.getElementById('topSub').textContent=panelTitle();if(currentPanel==='admin'){renderAdmin();return}document.getElementById('main').innerHTML=panelHome(currentPanel)}
function panelHome(panel){const p=PANEL_DEFS.find(x=>x[0]===panel);const info={customer:['Customer management, customer orders and account activity.',['View Customers','Customer Orders','Addresses & Profiles']],restaurant:['Restaurant management, menu and restaurant orders.',['Restaurants','Food / Menu','Restaurant Orders']],delivery:['Delivery partners, assignments and live delivery status.',['Delivery Partners','Assigned Orders','Delivery Status']]}[panel];return `<section class="launcher panel-home"><div class="panel-icon">${p[1]}</div><h1>${p[2]}</h1><p>${info[0]}</p><div class="service">📍 Haldwani delivery only</div></section><div class="grid cards">${info[1].map((x,i)=>`<div class="panel-card"><div class="panel-icon">${['📋','📦','📍'][i]}</div><h3>${x}</h3><p>Open this section without stacking another page underneath.</p><button class="btn primary" onclick="panelAction('${panel}',${i})">Open</button></div>`).join('')}</div><div class="actions"><button class="btn neutral" onclick="showLauncher()">Change Panel</button></div>`}
function panelAction(panel,i){if(panel==='customer'&&i===0){currentPanel='admin';currentAdminPage='customers';history.pushState({screen:'admin',page:'customers'},'',location.pathname+'#admin-customers');renderAdmin();return}if(panel==='restaurant'&&i===1){currentPanel='admin';currentAdminPage='foods';history.pushState({screen:'admin',page:'foods'},'',location.pathname+'#admin-foods');renderAdmin();return}if(panel==='delivery'&&i===1){currentPanel='admin';currentAdminPage='delivery';history.pushState({screen:'admin',page:'delivery'},'',location.pathname+'#admin-delivery');renderAdmin();return}toast('This panel section is ready for its connected module')}
function showLauncher(){currentPanel=null;history.pushState({screen:'launcher'},'',location.pathname+'#launcher');renderLauncher()}
function renderAdmin(){const name=ADMIN_PAGES.find(x=>x[0]===currentAdminPage)?.[1]||'Dashboard';document.getElementById('topSub').textContent='Admin · '+name;const page=adminPages[currentAdminPage]||adminPages.dashboard;document.getElementById('main').innerHTML=`<section class="launcher"><h1>SELECT ADMIN PAGE</h1><p>Open one admin page at a time</p><select class="admin-select" onchange="selectAdminPage(this.value)">${ADMIN_PAGES.map(p=>`<option value="${p[0]}" ${p[0]===currentAdminPage?'selected':''}>${p[1]}</option>`).join('')}</select></section>${page()}`}
function selectAdminPage(page){if(!ADMIN_PAGES.some(x=>x[0]===page))page='dashboard';currentAdminPage=page;loading();history.pushState({screen:'admin',page},'',location.pathname+'#admin-'+page);renderAdmin()}
window.addEventListener('popstate',e=>{if(sessionStorage.getItem('adminLogged')!=='1'){logout();return}const s=e.state;if(!s||s.screen==='launcher'){currentPanel=null;renderLauncher();return}if(s.screen==='panel'){currentPanel=s.panel;renderPanel();return}if(s.screen==='admin'){currentPanel='admin';currentAdminPage=s.page||'dashboard';renderAdmin();return}renderLauncher()});
function panelCardStats(){const o=db.orders;return `<div class="grid stats">${[['👥',db.customers.length,'Customers'],['🏪',db.restaurants.length,'Restaurants'],['🛵',db.delivery.length,'Delivery Partners'],['🧾',o.length,'Orders'],['🍲',db.foods.length,'Food Items'],['💳',db.payments.length,'Payments'],['🎟️',db.coupons.length,'Coupons'],['⭐',db.reviews.length,'Reviews'],['₹',money(o.reduce((s,x)=>s+Number(x.total||0),0)),'Order Value'],['📍','Haldwani','Service Area']].map(x=>`<div class="stat"><div class="icon">${x[0]}</div><div class="num">${x[1]}</div><div class="lab">${x[2]}</div></div>`).join('')}</div>`}
const adminPages={};
adminPages.dashboard=()=>`<div class="service">📍 Haldwani delivery only</div><div class="section-title"><h2>Admin Overview</h2></div>${panelCardStats()}<div class="section-title"><h2>Quick Management</h2></div><div class="grid cards">${[['👥','Customer Management','customers'],['🏪','Restaurant Management','restaurants'],['🛵','Delivery Management','delivery'],['🧾','Order Management','orders'],['🍲','Food/Menu Management','foods'],['💳','Payments','payments']].map(x=>`<div class="panel-card"><div class="panel-icon">${x[0]}</div><h3>${x[1]}</h3><button class="btn primary" onclick="selectAdminPage('${x[2]}')">Open</button></div>`).join('')}</div>`;
function toolbar(placeholder,add){return `<div class="toolbar"><input id="searchBox" placeholder="${placeholder}" oninput="filterTable(this.value)">${add?`<button class="btn primary" onclick="${add}">＋ Add</button>`:''}</div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}"><div class="empty">No records found</div></td></tr>`}</tbody></table></div>`}
function filterTable(q){document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(String(q).toLowerCase())?'':'none')}
function btns(type,id){return `<div class="actions"><button class="btn secondary" onclick="editItem('${type}','${id}')">Edit</button><button class="btn danger" onclick="deleteItem('${type}','${id}')">Delete</button></div>`}
adminPages.customers=()=>toolbar('Search customers...','addCustomer()')+table(['Customer','Contact','Address','Status','Actions'],db.customers.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="pill">${x.id}</span></td><td>${esc(x.phone)}<br>${esc(x.email)}</td><td>${esc(x.address)}</td><td><span class="status">${esc(x.status)}</span></td><td>${btns('customers',x.id)}</td></tr>`).join(''));
adminPages.restaurants=()=>toolbar('Search restaurants...','addRestaurant()')+table(['Restaurant','Owner / Contact','Address','Hours','Status','Actions'],db.restaurants.map(x=>`<tr><td><b>${esc(x.name)}</b><br>⭐ ${esc(x.rating)}</td><td>${esc(x.owner)}<br>${esc(x.phone)}<br>${esc(x.email)}</td><td>${esc(x.address)}</td><td>${esc(x.open)} - ${esc(x.close)}<br>Delivery: ${esc(x.delivery)}</td><td><span class="status">${esc(x.status)}</span></td><td>${btns('restaurants',x.id)}</td></tr>`).join(''));
adminPages.delivery=()=>toolbar('Search delivery partners...','addDelivery()')+table(['Partner','Contact','Vehicle','Availability','Stats','Actions'],db.delivery.map(x=>`<tr><td><b>${esc(x.name)}</b><br>${x.id}</td><td>${esc(x.phone)}<br>${esc(x.email)}</td><td>${esc(x.vehicle)}</td><td>${esc(x.availability)} / ${esc(x.online)}</td><td>Current: ${esc(x.current||'None')}<br>Completed: ${esc(x.completed||0)}<br>${money(x.earnings)}</td><td>${btns('delivery',x.id)}</td></tr>`).join(''))+`<div class="section-title"><h2>Order Assignment</h2></div>`+table(['Order','Customer','Amount','Status','Partner','Action'],db.orders.filter(x=>x.status!=='Delivered').map(x=>`<tr><td>${x.id}</td><td>${esc(x.customer)}</td><td>${money(x.total)}</td><td>${esc(x.status)}</td><td>${esc(x.delivery||'Unassigned')}</td><td><button class="btn primary" onclick="assignDelivery('${x.id}')">Assign</button></td></tr>`).join(''));
adminPages.orders=()=>`<div class="toolbar"><input placeholder="Search orders..." oninput="filterTable(this.value)"><select onchange="filterStatus(this.value)"><option value="">All Status</option>${['Pending','Confirmed','Preparing','Ready','Assigned','Out for Delivery','Delivered','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select></div>`+table(['Order','Customer','Food','Payment','Status','Actions'],db.orders.map(x=>`<tr><td><b>${x.id}</b><br>${esc(x.restaurant)}<br>${esc(x.address)}<br>${esc(x.date)} ${esc(x.time)}</td><td>${esc(x.customer)}<br>${esc(x.phone)}</td><td>${x.image?`<img class="food-img" src="${esc(x.image)}">`:''}<br>${esc(x.food)} × ${x.qty}<br>${money(x.price)} each<br><b>${money(x.total)}</b></td><td>${esc(x.payment)}<br>${esc(x.paymentStatus)}</td><td><span class="pill">${esc(x.status)}</span><br>${esc(x.delivery||'Unassigned')}</td><td><div class="actions"><button class="btn neutral" onclick="viewOrder('${x.id}')">View</button><button class="btn secondary" onclick="editOrder('${x.id}')">Edit</button><button class="btn primary" onclick="updateOrderStatus('${x.id}')">Status</button><button class="btn success" onclick="assignDelivery('${x.id}')">Assign</button><button class="btn danger" onclick="deleteItem('orders','${x.id}')">Delete</button></div></td></tr>`).join(''));
function filterStatus(v){document.querySelectorAll('tbody tr').forEach(r=>r.style.display=!v||r.innerText.includes(v)?'':'none')}
adminPages.foods=()=>toolbar('Search food items...','addFood()')+table(['Food','Price','Category / Restaurant','Options','Image','Actions'],db.foods.map(x=>`<tr><td><b>${esc(x.name)}</b><br>${esc(x.description)}</td><td>${money(x.price)}</td><td>${esc(x.category)}<br>${esc(x.restaurant)}</td><td>${esc(x.type)}<br>Available: ${esc(x.available)}<br>Popular: ${esc(x.popular)}<br>Special: ${esc(x.special)}</td><td>${x.image?`<img class="food-img" src="${esc(x.image)}">`:'No image'}</td><td>${btns('foods',x.id)}</td></tr>`).join(''));
adminPages.categories=()=>toolbar('Search categories...','addCategory()')+table(['Category','Image','Status','Actions'],db.categories.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.image?`<img class="food-img" src="${esc(x.image)}">`:'No image'}</td><td>${esc(x.status)}</td><td>${btns('categories',x.id)}</td></tr>`).join(''));
adminPages.payments=()=>table(['Order','Customer','Amount','Method','Status','Date / Transaction'],db.payments.map(x=>`<tr><td>${x.order}</td><td>${esc(x.customer)}</td><td>${money(x.amount)}</td><td>${esc(x.method)}</td><td>${esc(x.status)}</td><td>${esc(x.date)}<br>${esc(x.transaction||'—')}</td></tr>`).join(''));
adminPages.coupons=()=>toolbar('Search coupons...','addCoupon()')+table(['Code','Discount','Order Rules','Validity','Status','Actions'],db.coupons.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.type)} ${esc(x.value)}</td><td>Min ${money(x.min)}<br>Max ${money(x.max)}</td><td>${esc(x.start)} → ${esc(x.expiry)}</td><td>${esc(x.status)}</td><td>${btns('coupons',x.id)}</td></tr>`).join(''));
adminPages.subscriptions=()=>toolbar('Search plans...','addSubscription()')+table(['Plan','Price','Duration','Benefits','Status','Subscribers','Actions'],db.subscriptions.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.price)}</td><td>${esc(x.duration)}</td><td>${esc(x.benefits)}</td><td>${esc(x.status)}</td><td>${x.subscribers||0}</td><td>${btns('subscriptions',x.id)}</td></tr>`).join(''));
adminPages.reviews=()=>table(['Customer','Restaurant','Food','Rating','Review','Date','Status','Actions'],db.reviews.map(x=>`<tr><td>${esc(x.customer)}</td><td>${esc(x.restaurant)}</td><td>${esc(x.food)}</td><td>⭐ ${esc(x.rating)}</td><td>${esc(x.review)}</td><td>${esc(x.date)}</td><td>${esc(x.status)}</td><td><button class="btn secondary" onclick="toggleReview('${x.id}')">Hide/Show</button> <button class="btn danger" onclick="deleteItem('reviews','${x.id}')">Delete</button></td></tr>`).join(''));
adminPages.notifications=()=>toolbar('Search notifications...','addNotification()')+table(['Title','Message','Target','Date','Status','Actions'],db.notifications.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.message)}</td><td>${esc(x.target)}</td><td>${esc(x.date)}</td><td>${esc(x.status)}</td><td>${btns('notifications',x.id)}</td></tr>`).join(''));
adminPages.reports=()=>`${panelCardStats()}<div class="section-title"><h2>Reports & Settings</h2></div><form onsubmit="saveSettings(event)"><div class="grid cards"><div class="field"><label>Business Name</label><input name="business" value="${esc(db.settings.business)}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(db.settings.phone)}"></div><div class="field"><label>Email</label><input name="email" value="${esc(db.settings.email)}"></div><div class="field"><label>Service Area</label><input name="area" value="${esc(db.settings.area)}"></div><div class="field"><label>Delivery Charge</label><input name="deliveryCharge" type="number" value="${db.settings.deliveryCharge}"></div><div class="field"><label>Minimum Order</label><input name="minOrder" type="number" value="${db.settings.minOrder}"></div><div class="field"><label>Delivery Radius (km)</label><input name="radius" type="number" value="${db.settings.radius}"></div></div><div class="grid cards"><label class="panel-card"><input type="checkbox" name="cod" ${db.settings.cod?'checked':''}> COD ON</label><label class="panel-card"><input type="checkbox" name="upi" ${db.settings.upi?'checked':''}> UPI ON</label><label class="panel-card"><input type="checkbox" name="card" ${db.settings.card?'checked':''}> Card ON</label><label class="panel-card"><input type="checkbox" name="notifications" ${db.settings.notifications?'checked':''}> Notifications ON</label><label class="panel-card"><input type="checkbox" name="maintenance" ${db.settings.maintenance?'checked':''}> Maintenance Mode</label></div><div class="actions"><button class="btn primary" type="submit">Save Settings</button><button class="btn neutral" type="button" onclick="resetData()">Reset Demo Data</button></div></form>`;
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function formField(n,l,v='',type='text'){return `<div class="field"><label>${l}</label><input name="${n}" type="${type}" value="${esc(v)}"></div>`}
function openForm(type,item={}){const specs={customers:['Customer',[['name','Name'],['phone','Phone'],['email','Email'],['address','Address'],['status','Status']]],restaurants:['Restaurant',[['name','Restaurant Name'],['owner','Owner Name'],['phone','Phone'],['email','Email'],['address','Address'],['open','Opening Time'],['close','Closing Time'],['delivery','Delivery'],['rating','Rating'],['status','Status']]],delivery:['Delivery Partner',[['name','Name'],['phone','Phone'],['email','Email'],['address','Address'],['vehicle','Vehicle'],['availability','Availability'],['online','Online/Offline'],['earnings','Earnings','number']]],foods:['Food Item',[['name','Food Name'],['description','Description'],['price','Price','number'],['category','Category'],['restaurant','Restaurant'],['available','Available'],['type','Veg/Non-Veg'],['popular','Popular'],['special','Special'],['image','Image URL']]],categories:['Category',[['name','Category Name'],['image','Image URL'],['status','Status']]],coupons:['Coupon',[['code','Code'],['type','Discount Type'],['value','Discount Value'],['min','Minimum Order','number'],['max','Maximum Discount','number'],['start','Start Date'],['expiry','Expiry Date'],['status','Status']]],subscriptions:['Subscription',[['name','Plan Name'],['price','Price','number'],['duration','Duration'],['benefits','Benefits'],['status','Status'],['subscribers','Subscribers','number']]],notifications:['Notification',[['title','Title'],['message','Message'],['target','Target'],['date','Date'],['status','Status']]]};const s=specs[type];if(!s)return;const fields=s[1].map(a=>formField(a[0],a[1],item[a[0]]??'',a[2]||'text')).join('');modal((item.id?'Edit ':'Add ')+s[0],`<form onsubmit="saveItem(event,'${type}','${item.id||''}')"><div class="two">${fields}</div><div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn neutral" type="button" onclick="closeModal()">Cancel</button></div></form>`)}
function addCustomer(){openForm('customers')}function addRestaurant(){openForm('restaurants')}function addDelivery(){openForm('delivery')}function addFood(){openForm('foods')}function addCategory(){openForm('categories')}function addCoupon(){openForm('coupons')}function addSubscription(){openForm('subscriptions')}function addNotification(){openForm('notifications')}
function saveItem(e,type,id){e.preventDefault();const data=Object.fromEntries(new FormData(e).entries());['price','min','max','earnings','subscribers'].forEach(k=>{if(k in data)data[k]=Number(data[k]||0)});if(id){const i=db[type].findIndex(x=>x.id===id);if(i>=0)db[type][i]={...db[type][i],...data}}else{data.id=prefix(type)+String(Date.now()).slice(-6);db[type].push(data)}saveDB();closeModal();renderAdmin();toast(id?'Updated successfully':'Added successfully')}
function prefix(t){return ({customers:'C',restaurants:'R',delivery:'D',foods:'F',categories:'CAT',coupons:'CP',subscriptions:'SUB',notifications:'N',reviews:'REV',orders:'ORD'})[t]||'ID'}
function editItem(type,id){const x=db[type].find(x=>x.id===id);if(x)openForm(type,x)}
function deleteItem(type,id){if(!confirm('Delete this record?'))return;db[type]=db[type].filter(x=>x.id!==id);saveDB();renderAdmin();toast('Deleted successfully')}
function viewOrder(id){const x=db.orders.find(x=>x.id===id);if(!x)return;modal('Order Details',`<p><b>${x.id}</b></p><p>Customer: ${esc(x.customer)}<br>Phone: ${esc(x.phone)}<br>Address: ${esc(x.address)}<br>Restaurant: ${esc(x.restaurant)}<br>Food: ${esc(x.food)} × ${x.qty}<br>Total: ${money(x.total)}<br>Payment: ${esc(x.payment)} (${esc(x.paymentStatus)})<br>Status: ${esc(x.status)}<br>Delivery: ${esc(x.delivery||'Unassigned')}</p>`)}
function editOrder(id){const x=db.orders.find(x=>x.id===id);if(!x)return;modal('Edit Order',`<form onsubmit="saveOrder(event,'${id}')">${formField('status','Order Status',x.status)}${formField('paymentStatus','Payment Status',x.paymentStatus)}${formField('delivery','Delivery Partner',x.delivery||'')}<div class="actions"><button class="btn primary">Save</button></div></form>`)}
function saveOrder(e,id){e.preventDefault();Object.assign(db.orders.find(x=>x.id===id),Object.fromEntries(new FormData(e).entries()));saveDB();closeModal();renderAdmin();toast('Order updated successfully')}
function updateOrderStatus(id){const x=db.orders.find(x=>x.id===id);if(!x)return;const states=['Pending','Confirmed','Preparing','Ready','Assigned','Out for Delivery','Delivered'];let i=states.indexOf(x.status);x.status=i<0?'Pending':states[Math.min(i+1,states.length-1)];saveDB();renderAdmin();toast('Order status updated')}
function assignDelivery(orderId){if(!db.delivery.length){toast('Add a delivery partner first',true);return}modal('Assign Delivery Partner',db.delivery.map(d=>`<button class="btn ${d.online==='Online'?'primary':'neutral'} full" style="margin-top:8px" onclick="doAssign('${orderId}','${d.id}')">🛵 ${esc(d.name)} — ${esc(d.online)}</button>`).join(''))}
function doAssign(orderId,did){const o=db.orders.find(x=>x.id===orderId),d=db.delivery.find(x=>x.id===did);if(!o||!d)return;o.delivery=d.name;o.status='Assigned';d.current=orderId;d.availability='Busy';saveDB();closeModal();renderAdmin();toast('Delivery partner assigned')}
function toggleReview(id){const x=db.reviews.find(x=>x.id===id);if(!x)return;x.status=x.status==='Visible'?'Hidden':'Visible';saveDB();renderAdmin()}
function saveSettings(e){e.preventDefault();const f=new FormData(e);db.settings={...db.settings,business:f.get('business'),phone:f.get('phone'),email:f.get('email'),area:f.get('area'),deliveryCharge:Number(f.get('deliveryCharge')),minOrder:Number(f.get('minOrder')),radius:Number(f.get('radius')),cod:f.has('cod'),upi:f.has('upi'),card:f.has('card'),notifications:f.has('notifications'),maintenance:f.has('maintenance')};saveDB();toast('Settings saved successfully')}
function resetData(){if(confirm('Reset all local demo data?')){db=clone(seed);saveDB();renderAdmin();toast('Demo data reset')}}
function boot(){if(sessionStorage.getItem('adminLogged')==='1'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');const h=location.hash;if(h.startsWith('#admin-')){currentPanel='admin';currentAdminPage=h.slice(7)||'dashboard';if(!ADMIN_PAGES.some(x=>x[0]===currentAdminPage))currentAdminPage='dashboard';renderAdmin()}else if(h.startsWith('#panel-')){currentPanel=h.slice(7);if(!PANEL_DEFS.some(x=>x[0]===currentPanel))currentPanel=null;currentPanel?renderPanel():renderLauncher()}else renderLauncher()}else renderLauncher()}
boot();
</script>
</body>
</html>
